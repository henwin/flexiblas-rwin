name: Rblas.dll with -O3, every routine bit for bit

# Builds R's BLAS from R-devel's sources with R's flags and with candidate
# flags (tests/blas-bitwise.sh) using Rtools45, and compares every routine
# bit for bit; the build with R's flags is first compared with CRAN's
# R-devel's own Rblas.dll.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: C:\rtools45\usr\bin\bash.exe --login -o pipefail {0}
    env:
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          rtools-version: '45'

      # The MSYS2 login shell below does not inherit the Windows PATH
      - name: Locate R
        shell: pwsh
        run: |
          $h = Rscript -e "cat(normalizePath(R.home()))"
          "R_HOME_DIR=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build and compare
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PATH
          rhome=$(cygpath -u "$R_HOME_DIR")
          mkdir -p src work
          for f in blas.f blas2.f90 cmplxblas.f cmplxblas2.f90 Rblas.def; do
            curl -sSf -o "src/$f" "https://svn.r-project.org/R/trunk/src/extra/blas/$f"
          done
          gfortran --version | head -1
          cd work
          bash ../tests/blas-bitwise.sh ../src "$rhome" 2>&1 | tee ../blas-bitwise.log

      - uses: ./.github/actions/report
        if: always()
        with:
          status: ${{ job.status }}
          files: blas-bitwise.log
