name: Rblas.dll with -O3, CRAN and recommended packages

# What an Rblas.dll built with -O3 instead of -O2 (r76787) changes, with the
# CRAN R (devel by default, or release) and its Rblas.dll against a copy of
# R whose Rblas.dll is rebuilt with -O3 (.github/actions/rblas-o3): R CMD
# check of the recommended packages (job base) and of CRAN packages (job
# packages), by default those that call the BLAS or LAPACK themselves
# (tests/cran-blas-users.sh: a DLL in their Windows binary imports from
# Rblas.dll or Rlapack.dll), or a reproducible sample of the others
# (tests/cran-others-sample.sh), reported apart. Each package is checked
# under CRAN's R twice and under the -O3 copy, and tools::Rdiff of every
# output against the first run is printed in full (tests/check-runs.sh);
# the review is separate. R's own tests need R built with that DLL
# (o3-rtests.yml).
on:
  workflow_dispatch:
    inputs:
      packages:
        description: CRAN packages, separated by spaces (empty for the set below; "none" for no packages)
        default: ''
      set:
        description: Without packages named, the packages that call the BLAS or LAPACK, or a sample of the others
        type: choice
        options: [call the BLAS, sample of the others]
        default: call the BLAS
      sample:
        description: Size and seed of the sample of the others
        default: '1000 1'
      groups:
        description: Number of parallel jobs for the packages (at most 256)
        default: '64'
      base:
        description: Also the recommended packages
        type: boolean
        default: false
      r:
        description: The R to test with, as CRAN builds it and its package binaries
        type: choice
        options: [devel, release]
        default: devel

permissions:
  actions: read
  contents: read
  issues: write

# runs that report to the same comment wait for each other rather than race
# (the base job's comment is shared by every set; runs with base are rare)
concurrency:
  group: ${{ github.workflow }}-${{ inputs.packages != '' && 'named' || inputs.set }}
  cancel-in-progress: false

jobs:
  select:
    if: inputs.packages != 'none'
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.split.outputs.groups }}
    steps:
      - uses: actions/checkout@v7

      - name: The packages
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            echo ${{ inputs.packages }} | tr ' ' '\n' > packages.txt
          else
            # the version behind "devel" or "release", which names the CRAN binary directory
            v=$(curl -sSf "https://api.r-hub.io/rversions/resolve/${{ inputs.r }}" | jq -r .version | cut -d. -f1,2)
            if [ "${{ inputs.set }}" = "sample of the others" ]; then
              tests/cran-others-sample.sh "$v" ${{ inputs.sample }} > packages.txt
            else
              tests/cran-blas-users.sh "$v" > packages.txt
            fi
          fi
          echo "$(wc -l < packages.txt) packages"

      - name: Split into groups
        id: split
        run: |
          n=$(wc -l < packages.txt); g=${{ inputs.groups }}; [ "$g" -gt "$n" ] && g=$n
          # round robin, so that groups get packages from the whole alphabet
          awk -v g="$g" '{a[NR % g] = a[NR % g] " " $1} END {for (i = 0; i < g; i++) print substr(a[i], 2)}' packages.txt |
            jq -R . | jq -sc . > groups.json
          echo "groups=$(cat groups.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages.txt

  packages:
    needs: select
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # of the 20 jobs an account runs at once, some left for the builds
      max-parallel: 14
      matrix:
        group: ${{ fromJSON(needs.select.outputs.groups) }}
    env:
      PKGS: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: The dependencies
        shell: bash
        run: Rscript tests/install-deps.R $PKGS 2>&1 | tee install.log

      # short of the job's limit, so that the logs are still uploaded
      - name: R CMD check under each DLL
        timeout-minutes: 330
        shell: bash
        run: |
          h=$(cygpath -u "$R_HOME_DIR")
          bash tests/check-runs.sh cran1="$h/bin" cran2="$h/bin" o3=/c/R-o3/bin -- $PKGS 2>&1 | tee check.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ strategy.job-index }}
          path: |
            check.log
            install.log
            chk-*/*.out
            chk-*/*.Rcheck/00check.log
            chk-*/*.Rcheck/00install.out
            chk-*/*.Rcheck/*-Ex.Rout*
            chk-*/*.Rcheck/tests/*.Rout*

  summary:
    needs: packages
    if: always() && needs.packages.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          merge-multiple: false

      - name: Summarise
        id: summarise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat log-*/check.log 2>/dev/null | tr -d '\r' > all.log
          # the status is that of the group jobs, which have finished
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name | startswith("packages")) | .conclusion' > groups.txt
          g=$(grep -c . groups.txt || true); ok=$(grep -cx success groups.txt || true)
          if [ "$g" -gt 0 ] && [ "$ok" -eq "$g" ]; then st=success; else st=failure; fi
          echo "status=$st" >> $GITHUB_OUTPUT
          echo "groups=$ok of $g" >> $GITHUB_OUTPUT
          {
            if [ -n "${{ inputs.packages }}" ]; then echo "packages: ${{ inputs.packages }}"
            elif [ "${{ inputs.set }}" = "sample of the others" ]; then echo "a sample of the packages that do not call the BLAS or LAPACK: size and seed ${{ inputs.sample }}"
            else echo "the packages that call the BLAS or LAPACK"; fi
            echo "$g groups"
          } > ran.txt
          # the status of every check, and the outputs Rdiff found different:
          # an index to the job logs and artifacts, which hold everything
          grep -E '^(cran1|cran2|o3) [^ ]+: ' all.log > status.txt || true
          awk '/^== / {h = $0; next} h != "" && $0 != "no differences" {print h} {h = ""}' all.log > differ.txt || true
          { echo "checks: $(wc -l < status.txt), of which not finished: $(grep -c 'check did not finish' status.txt)"
            echo "outputs Rdiff finds different, cran1 against cran2: $(grep -c ' chk-cran2/' differ.txt)"
            echo "outputs Rdiff finds different, cran1 against o3: $(grep -c ' chk-o3/' differ.txt)"
          } > summary.txt
          cat summary.txt

      - uses: ./.github/actions/report
        if: always()
        with:
          # named packages and the sample of the others in comments of their own
          key: ${{ github.workflow }}${{ inputs.packages != '' && ' (named packages)' || inputs.set == 'sample of the others' && ' (a sample of the other packages)' || '' }}
          status: ${{ steps.summarise.outcome == 'failure' && 'failure' || steps.summarise.outputs.status || needs.packages.result }}
          ran: ran.txt
          checks: |
            ${{ steps.summarise.outputs.status }} | every group job succeeded: dependencies installed and every check ran to its end (${{ steps.summarise.outputs.groups }})
          results: summary.txt
          files: |
            Outputs that differ: differ.txt
            Status of every check: status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: |
            all.log
            status.txt
            differ.txt
            summary.txt

  base:
    if: inputs.base
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: R CMD check under each DLL
        id: base
        shell: bash
        run: |
          h=$(cygpath -u "$R_HOME_DIR")
          pkgs=$(Rscript -e 'cat(rownames(installed.packages(priority = "recommended")))')
          Rscript tests/install-deps.R $pkgs 2>&1 | tee install.log
          bash tests/check-runs.sh cran1="$h/bin" cran2="$h/bin" o3=/c/R-o3/bin -- $pkgs 2>&1 | tee check.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          echo "$(Rscript -e 'cat(R.version.string)' 2>/dev/null), the recommended packages" > ran.txt
          grep -E '^(cran1|cran2|o3) [^ ]+: ' check.log > results.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base
          path: |
            check.log
            install.log
            chk-*/*.out
            chk-*/*.Rcheck/00check.log
            chk-*/*.Rcheck/00install.out
            chk-*/*.Rcheck/*-Ex.Rout*
            chk-*/*.Rcheck/tests/*.Rout*

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (the recommended packages)
          status: ${{ job.status }}
          ran: ran.txt
          checks: |
            ${{ steps.base.outcome }} | R CMD check ran to the end under each DLL
          results: results.txt
          files: |
            Rdiff of every output: check.log
