name: Rblas.dll with -O3, CRAN and recommended packages

# What an Rblas.dll built with -O3 instead of -O2 (r76787) changes in the
# output of examples and tests, with the CRAN R (devel by default, or
# release) and its Rblas.dll against a copy of R whose Rblas.dll is rebuilt
# with -O3 (.github/actions/rblas-o3): the recommended packages (job base),
# and CRAN packages (job packages), by default those that call the BLAS or
# LAPACK themselves (tests/cran-blas-users.sh: a DLL in their Windows binary
# imports from Rblas.dll or Rlapack.dll), or a reproducible sample of the
# others (tests/cran-others-sample.sh), which reach the BLAS only through
# R's own functions, reported apart; as the CRAN binaries for that R
# with the tests taken from their sources. R's own tests need R built with
# that DLL (build-r.yml, experiment "Rblas -O3"). A
# package whose outputs differ runs once more each way, and a line counts
# only if both runs of each side agree on it (tests/compare-optflags.R).
on:
  workflow_dispatch:
    inputs:
      packages:
        description: CRAN packages, separated by spaces (empty for the set below; "none" for no packages)
        default: ''
      set:
        description: Without packages named, the packages that call the BLAS or LAPACK, or a sample of the others
        type: choice
        options: [call the BLAS, sample of the others]
        default: call the BLAS
      sample:
        description: Size and seed of the sample of the others
        default: '1000 1'
      groups:
        description: Number of parallel jobs for the packages (at most 256)
        default: '64'
      base:
        description: Also the recommended packages
        type: boolean
        default: false
      r:
        description: The R to test with, as CRAN builds it and its package binaries
        type: choice
        options: [devel, release]
        default: devel
      summarise:
        description: Only summarise the package logs of this earlier run (its id), for a run whose summary job failed; give the set of that run too, which names its comment
        default: ''

permissions:
  actions: read
  contents: read
  issues: write

env:
  OPTFLAGS_WORK: ${{ github.workspace }}\optflags-work

jobs:
  select:
    if: inputs.packages != 'none' && inputs.summarise == ''
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.split.outputs.groups }}
    steps:
      - uses: actions/checkout@v7

      - name: The packages
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            echo ${{ inputs.packages }} | tr ' ' '\n' > packages.txt
          else
            # the version behind "devel" or "release", which names the CRAN binary directory
            v=$(curl -sSf "https://api.r-hub.io/rversions/resolve/${{ inputs.r }}" | jq -r .version | cut -d. -f1,2)
            if [ "${{ inputs.set }}" = "sample of the others" ]; then
              tests/cran-others-sample.sh "$v" ${{ inputs.sample }} > packages.txt
            else
              tests/cran-blas-users.sh "$v" > packages.txt
            fi
          fi
          echo "$(wc -l < packages.txt) packages"

      - name: Split into groups
        id: split
        run: |
          n=$(wc -l < packages.txt); g=${{ inputs.groups }}; [ "$g" -gt "$n" ] && g=$n
          # round robin, so that groups get packages from the whole alphabet
          awk -v g="$g" '{a[NR % g] = a[NR % g] " " $1} END {for (i = 0; i < g; i++) print substr(a[i], 2)}' packages.txt |
            jq -R . | jq -sc . > groups.json
          echo "groups=$(cat groups.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages.txt

  packages:
    needs: select
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.groups) }}
    env:
      PKGS: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: Install the packages
        shell: bash
        run: Rscript tests/compare-optflags.R binary $PKGS 2>&1 | tee -a optflags.log

      - name: Run examples and tests
        shell: bash
        run: |
          # one package at a time, so that a package that hangs costs only its own time
          run() {   # run package
            R=Rscript; [ "${1:0:2}" = O3 ] && R=/c/R-o3/bin/Rscript
            timeout 3600 $R tests/compare-optflags.R test $1 default $2 > /dev/null 2>&1 || {
              st=$?
              echo "$2 $1: exit status $st" | tee -a optflags.log
              printf '%s\t%s\t%s\n' "$2" "$1" "$st" >> failed.tsv
              # timeout kills Rscript only; the Rterm it started and the R CMD
              # BATCH processes under it live on with the output files open
              [ $st != 124 ] || taskkill //F //T //IM Rterm.exe > /dev/null 2>&1 || true
              # a killed run leaves a truncated .Rout, which must not be compared
              rm -rf "$OPTFLAGS_WORK/out-$1/$2" || { sleep 10; rm -rf "$OPTFLAGS_WORK/out-$1/$2"; } ||
                echo "$2 $1: output not removed" | tee -a optflags.log
            }
          }
          # One run each way first: a file on which they agree line for line
          # is the same whatever further runs would show. A package with a
          # difference runs once more each way, and a line counts only if
          # both runs of each side bear it out.
          for p in $PKGS; do run O2 $p; run O3 $p; done
          # The counts per package come from compare.tsv, each comparison
          # adding its packages; result.tsv exists only when both passes are done.
          Rscript tests/compare-optflags.R compare O2 O3 $PKGS > pass1.log 2>&1
          differ=$(tr -d '\r' < compare.tsv | awk -F'\t' 'NR > 1 && $4 > 0 {print $1}')
          tr -d '\r' < compare.tsv | head -1 > result.part
          rest=$(comm -23 <(tr ' ' '\n' <<< "$PKGS" | sort) <(tr ' ' '\n' <<< "$differ" | sort))
          [ -z "$rest" ] || {
            Rscript tests/compare-optflags.R compare O2 O3 $rest 2>&1 | tee -a optflags.log
            tr -d '\r' < compare.tsv | tail -n +2 >> result.part
          }
          [ -z "$differ" ] || {
            for p in $differ; do run O2b $p; run O3b $p; done
            Rscript tests/compare-optflags.R compare O2,O2b O3,O3b $differ 2>&1 | tee -a optflags.log
            tr -d '\r' < compare.tsv | tail -n +2 >> result.part
          }
          mv result.part result.tsv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ strategy.job-index }}
          path: |
            optflags.log
            result.tsv
            binary.tsv
            failed.tsv

  summary:
    needs: packages
    if: always() && (inputs.summarise != '' || needs.packages.result != 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          merge-multiple: false
          run-id: ${{ inputs.summarise || github.run_id }}
          github-token: ${{ github.token }}

      - name: Summarise
        id: summarise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat log-*/optflags.log | tr -d '\r' > all.log
          # the counts from the files the groups wrote; the log is the detail
          cat log-*/result.tsv 2>/dev/null | tr -d '\r' | awk -F'\t' '$1 != "package"' > result.tsv
          cat log-*/binary.tsv 2>/dev/null | tr -d '\r' > binary.tsv
          cat log-*/failed.tsv 2>/dev/null | tr -d '\r' > failed.tsv
          # the run the logs come from, when summarising an earlier one
          run=${{ inputs.summarise || github.run_id }}
          # the status is that of the run's group jobs, which have finished
          # also when the run summarised is this one
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name | startswith("packages")) | .conclusion' > groups.txt
          g=$(grep -c . groups.txt || true); ok=$(grep -cx success groups.txt || true)
          if [ "$g" -gt 0 ] && [ "$ok" -eq "$g" ]; then st=success; else st=failure; fi
          echo "status=$st" >> $GITHUB_OUTPUT
          {
            [ -n "${{ inputs.packages }}" ] || [ "${{ inputs.set }}" != "sample of the others" ] ||
              echo "a sample of the packages that do not call the BLAS or LAPACK: size and seed ${{ inputs.sample }}"
            echo "group jobs of run $run: $ok of $g succeeded"
            echo "logs downloaded: $(ls -d log-*/ 2>/dev/null | wc -l) of $g"
            echo "groups with results: $(ls log-*/result.tsv 2>/dev/null | wc -l) of $g"
            echo "packages compared (run $run): $(awk -F'\t' '$2 > 0' result.tsv | wc -l)"
            echo "packages without output in any run: $(awk -F'\t' '$2 == 0 {printf " %s", $1}' result.tsv)"
            echo "not installed: $(awk -F'\t' '$2 == "not installed"' binary.tsv | wc -l)"
            echo "test runs that crashed or timed out: $(wc -l < failed.tsv)"
            # result.tsv: package, files, same, differ, failed, missing, unstable
            awk -F'\t' '{s += $3; d += $4; f += $5; m += $6; u += $7} END {printf "output files: %d same, %d differ, %d failed in every run, %d missing in some run, %d unstable within a set of runs\n", s, d, f, m, u}' result.tsv
            echo "packages with output files that differ with the -O3 Rblas.dll:"
            awk -F'\t' '$4 > 0 {print "  " $1 ": " $4}' result.tsv
            # jobs that failed, and R errors in their logs
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "failed job: " + .name'
          } > summary.txt
          cat summary.txt
          # the differing lines
          grep -aE '^(  \S+: |    O[23]b?: )' all.log > detail.txt || true
          # the stable differences alone, first, since the detail is cut at the comment's size
          awk '/stable lines differ/ {p = 1; print; next} /^  [^ ]/ {p = 0} p' all.log > differ.txt || true
          # the runs that failed or timed out (124), which run of which package
          { awk -F'\t' '{print $1 " " $2 ": exit status " $3}' failed.tsv; grep -aE 'output not removed|^Error' all.log; } | sort > failed.txt || true

      - uses: ./.github/actions/report
        if: always()
        with:
          # the sample of the others in a comment of its own
          key: ${{ github.workflow }}${{ inputs.packages == '' && inputs.set == 'sample of the others' && ' (a sample of the other packages)' || '' }}
          status: ${{ steps.summarise.outputs.status || needs.packages.result }}
          summary: summary.txt
          files: |
            Stable differences: differ.txt
            Differences: detail.txt
            Failed or timed out: failed.txt

      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            all.log
            result.tsv
            summary.txt

  base:
    if: inputs.base && inputs.summarise == ''
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: The recommended packages
        id: base
        shell: bash
        run: |
          Rscript tests/compare-optflags.R base O2 2>&1 | tee -a optflags.log
          /c/R-o3/bin/Rscript tests/compare-optflags.R base O3 2>&1 | tee -a optflags.log
          # as for the packages: a second run each way only when they differ
          Rscript tests/compare-optflags.R compare O2 O3 2>&1 | tee -a optflags.log
          if tr -d '\r' < compare.tsv | awk -F'\t' 'NR > 1 && $4 > 0 {d = 1} END {exit !d}'; then
            Rscript tests/compare-optflags.R base O2b 2>&1 | tee -a optflags.log
            /c/R-o3/bin/Rscript tests/compare-optflags.R base O3b 2>&1 | tee -a optflags.log
            Rscript tests/compare-optflags.R compare O2,O2b O3,O3b 2>&1 | tee -a optflags.log
          fi

      - name: Summarise
        if: always()
        shell: bash
        run: |
          set +e
          grep -aE '^(O[23]b?: |test|== |total |  \S+: |    O[23]b?: )' optflags.log > summary.log
          # the outcome, then the totals per group and comparison; the
          # differing lines are the detail
          { echo "runs and comparisons: ${{ steps.base.outcome }}"
            grep -aE '^(test|== |total )' optflags.log 2>/dev/null || echo "not found in optflags.log"; } > brief.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (the recommended packages)
          status: ${{ job.status }}
          summary: brief.log
          files: |
            Differences in detail: summary.log
            optflags.log
