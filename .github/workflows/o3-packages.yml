name: Rblas.dll with -O3, CRAN packages and the R tests

# What an Rblas.dll built with -O3 instead of -O2 (r76787) changes in the
# output of examples and tests, with the CRAN R (devel by default, or
# release) and its Rblas.dll against a copy of R whose Rblas.dll is rebuilt
# with -O3 (.github/actions/rblas-o3): the R tests and the recommended
# packages (job base), and CRAN packages (job packages), by default those
# that call the BLAS or LAPACK themselves (tests/cran-blas-users.sh: a DLL
# in their Windows binary imports from Rblas.dll or Rlapack.dll), as the
# CRAN binaries for that R with the tests taken from their sources. The reference runs twice, and only output lines on which
# both runs agree count (tests/compare-optflags.R).
on:
  workflow_dispatch:
    inputs:
      packages:
        description: CRAN packages, separated by spaces (empty for all that call the BLAS or LAPACK; "none" for no packages)
        default: ''
      groups:
        description: Number of parallel jobs for the packages (at most 256)
        default: '64'
      base:
        description: Also the R tests and the recommended packages
        type: boolean
        default: false
      r:
        description: The R to test with, as CRAN builds it and its package binaries
        type: choice
        options: [devel, release]
        default: devel

permissions:
  actions: read
  contents: read
  issues: write

env:
  OPTFLAGS_WORK: ${{ github.workspace }}\optflags-work

jobs:
  select:
    if: inputs.packages != 'none'
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.split.outputs.groups }}
    steps:
      - uses: actions/checkout@v7

      - name: Packages that call the BLAS or LAPACK
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            echo ${{ inputs.packages }} | tr ' ' '\n' > packages.txt
          else
            # the version behind "devel" or "release", which names the CRAN binary directory
            v=$(curl -sSf "https://api.r-hub.io/rversions/resolve/${{ inputs.r }}" | jq -r .version | cut -d. -f1,2)
            tests/cran-blas-users.sh "$v" > packages.txt
          fi
          echo "$(wc -l < packages.txt) packages"

      - name: Split into groups
        id: split
        run: |
          n=$(wc -l < packages.txt); g=${{ inputs.groups }}; [ "$g" -gt "$n" ] && g=$n
          # round robin, so that groups get packages from the whole alphabet
          awk -v g="$g" '{a[NR % g] = a[NR % g] " " $1} END {for (i = 0; i < g; i++) print substr(a[i], 2)}' packages.txt |
            jq -R . | jq -sc . > groups.json
          echo "groups=$(cat groups.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages.txt

  packages:
    needs: select
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.groups) }}
    env:
      PKGS: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: Install the packages
        shell: bash
        run: Rscript tests/compare-optflags.R binary $PKGS 2>&1 | tee -a optflags.log

      - name: Run examples and tests
        shell: bash
        run: |
          # one package at a time, so that a package that hangs costs only its own time
          run() {   # run package
            R=Rscript; [ "${1:0:2}" = O3 ] && R=/c/R-o3/bin/Rscript
            timeout 1800 $R tests/compare-optflags.R test $1 default $2 > /dev/null 2>&1 || {
              st=$?
              echo "$2 $1: exit status $st" | tee -a optflags.log
              # timeout kills Rscript only; the Rterm it started and the R CMD
              # BATCH processes under it live on with the output files open
              [ $st != 124 ] || taskkill //F //T //IM Rterm.exe > /dev/null 2>&1 || true
              # a killed run leaves a truncated .Rout, which must not be compared
              rm -rf "$OPTFLAGS_WORK/out-$1/$2" || { sleep 10; rm -rf "$OPTFLAGS_WORK/out-$1/$2"; } ||
                echo "$2 $1: output not removed" | tee -a optflags.log
            }
          }
          for p in $PKGS; do for r in O2 O2b O3; do run $r $p; done; done
          Rscript tests/compare-optflags.R compare O2,O2b O3 $PKGS > pass1.log 2>&1
          # Two runs of the reference can agree on a line by chance, a timing
          # that rounds to 0, say; a package with differences runs once more
          # each way, and a line counts only if all five runs bear it out.
          differ=$(awk '/^== / && $8 > 0 {print $2}' pass1.log)
          rest=$(comm -23 <(tr ' ' '\n' <<< "$PKGS" | sort) <(tr ' ' '\n' <<< "$differ" | sort))
          [ -z "$rest" ] || Rscript tests/compare-optflags.R compare O2,O2b O3 $rest 2>&1 | tee -a optflags.log
          [ -z "$differ" ] || {
            for p in $differ; do run O2c $p; run O3b $p; done
            Rscript tests/compare-optflags.R compare O2,O2b,O2c O3,O3b $differ 2>&1 | tee -a optflags.log
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ strategy.job-index }}
          path: optflags.log

  summary:
    needs: packages
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          merge-multiple: false

      - name: Summarise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat log-*/optflags.log | tr -d '\r' > all.log
          {
            echo "packages compared: $(grep -ac '^== ' all.log)"
            echo "not installed: $(grep -ac ' not installed$' all.log)"
            echo "test runs that crashed or timed out: $(grep -ac ': exit status ' all.log)"
            # the per-package lines: "== pkg N output files: a same, b differ in O3, c failed, d missing, e unstable"
            grep -a '^== ' all.log |
              awk '{s += $6; d += $8; f += $12; m += $14; u += $16} END {printf "output files: %d same, %d differ, %d failed in every run, %d missing in some run, %d unstable within a set of runs\n", s, d, f, m, u}'
            echo "packages with output files that differ with the -O3 Rblas.dll:"
            grep -a '^== ' all.log | awk '$8 > 0 {print "  " $2 ": " $8}'
            # jobs that failed, and R errors in their logs
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "failed job: " + .name'
          } > summary.txt
          cat summary.txt
          # the differing lines
          grep -aE '^(  \S+: |    O[23]: )' all.log > detail.txt || true
          # the runs that failed or timed out (124), which run of which package
          grep -a ': exit status |output not removed|^Error' all.log | sort > failed.txt || true

      - uses: ./.github/actions/report
        if: always()
        with:
          status: ${{ needs.packages.result }}
          files: |
            summary.txt
            Differences: detail.txt
            Failed or timed out: failed.txt

      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            all.log
            summary.txt

  base:
    if: inputs.base
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: The R tests and the recommended packages
        shell: bash
        run: |
          Rscript tests/compare-optflags.R base O2 2>&1 | tee -a optflags.log
          Rscript tests/compare-optflags.R base O2b 2>&1 | tee -a optflags.log
          /c/R-o3/bin/Rscript tests/compare-optflags.R base O3 2>&1 | tee -a optflags.log
          Rscript tests/compare-optflags.R compare O2 O2b O3 2>&1 | tee -a optflags.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          grep -aE '^(O[23]b?: |test|== |total |  \S+: |    O[23]: )' optflags.log > summary.log || true

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (the R tests and the recommended packages)
          status: ${{ job.status }}
          files: |
            summary.log
            optflags.log
