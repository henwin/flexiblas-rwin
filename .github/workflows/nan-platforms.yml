name: NA, NaN and Inf outside Windows

# Three comparisons of how NA, NaN and Inf come out, to put the Windows
# results in context: FlexiBLAS's backends against each other on Fedora
# and Accelerate against R's BLAS on macOS (tests/test-nan.R, with the
# memory use of the OpenBLAS backends, tests/test-memory.R); and where NA
# and NaN meet in one result (tests/test-nan-mixed.R), R's own BLAS, LAPACK
# and arithmetic of CRAN's R (Posit's builds on Linux) on Windows, Linux
# and macOS, x86-64 and arm64, compared with each other.
on:
  push:
    branches: [master]
    paths: [tests/test-nan.R, tests/test-nan-mixed.R, tests/test-memory.R, .github/workflows/nan-platforms.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backends-linux:
    name: Fedora, FlexiBLAS backends against each other
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install R with FlexiBLAS and its backends
        run: |
          dnf install -y -q R-core R-flexiblas flexiblas-netlib binutils gh \
              flexiblas-openblas-serial flexiblas-openblas-openmp flexiblas-openblas-threads
          flexiblas list
          # OpenBLAS's build configuration, including MAX_THREADS (NUM_THREADS)
          for f in /usr/lib64/libopenblas*.so.0; do echo "$f: $(strings "$f" | grep -m1 'MAX_THREADS')"; done

      - name: Compare backends
        run: Rscript tests/test-nan.R cmp 2>&1 | tee nan.log

      - name: Memory use
        run: |
          for b in OPENBLAS-OPENMP OPENBLAS-THREADS; do
            Rscript tests/test-memory.R $b
            OPENBLAS_NUM_THREADS=1 Rscript tests/test-memory.R $b
          done 2>&1 | tee memory.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (Fedora backends)
          status: ${{ job.status }}
          files: |
            nan.log
            memory.log

  backends-macos:
    name: macOS arm64, R's BLAS against Accelerate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Reference with R's own BLAS
        run: Rscript tests/test-nan.R ref

      - name: Switch libRblas to Accelerate (vecLib) and compare
        run: |
          lib=$(Rscript -e 'cat(R.home("lib"))')
          ls -l "$lib"/libRblas*
          ln -sf libRblas.vecLib.dylib "$lib/libRblas.dylib"
          Rscript -e 'sessionInfo()' | grep -i -A2 blas
          Rscript tests/test-nan.R cmp 2>&1 | tee nan.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (macOS Accelerate)
          status: ${{ job.status }}
          files: nan.log

  platforms:
    name: R's own BLAS, LAPACK and arithmetic per platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, label: windows-x86-64 }
          - { os: ubuntu-24.04, label: linux-x86-64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86-64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Record
        shell: bash
        run: Rscript tests/test-nan-mixed.R run ${{ matrix.label }}
      - uses: actions/upload-artifact@v7
        with:
          name: nan-mixed-${{ matrix.label }}
          path: nan-mixed-${{ matrix.label }}.txt

  compare:
    needs: platforms
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/download-artifact@v8
        with:
          pattern: nan-mixed-*
          merge-multiple: true
      - name: Compare
        run: Rscript tests/test-nan-mixed.R compare nan-mixed-*.txt 2>&1 | tee compare.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (platforms)
          status: ${{ job.status }}
          files: compare.log
