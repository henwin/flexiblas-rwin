name: Rblas.dll with -O3, whole DLLs in R, results and timings

# Builds Rblas.dll and Rlapack.dll from R-devel's sources with R's flags,
# with the other optimisation level and with -march=native
# (tests/flags-build.sh), swaps them into CRAN's R-devel one at a time, and
# compares R's BLAS and LAPACK results bit for bit with those of CRAN's own
# DLLs and their timings (tests/test-flags.R).
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# runs that report to the same comment wait for each other rather than race
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: C:\rtools45\usr\bin\bash.exe --login -o pipefail {0}
    env:
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          rtools-version: '45'

      # The MSYS2 login shell below does not inherit the Windows PATH
      - name: Locate R
        shell: pwsh
        run: |
          $h = Rscript -e "cat(normalizePath(R.home()))"
          "R_HOME_DIR=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CPU: " + (Get-CimInstance Win32_Processor).Name | Tee-Object -FilePath cpu.txt

      - name: Build the DLLs
        id: build
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PATH
          rhome=$(cygpath -u "$R_HOME_DIR")
          mkdir -p src work
          for f in blas.f blas2.f90 cmplxblas.f cmplxblas2.f90 Rblas.def; do
            curl -sSf -o "src/$f" "https://svn.r-project.org/R/trunk/src/extra/blas/$f"
          done
          for f in dlamch.f dlapack.f cmplx.f la_constants.f90 la_xisnan.f90 dlartg.f90 dlassq.f90 zlartg.f90 zlassq.f90; do
            curl -sSf -o "src/$f" "https://svn.r-project.org/R/trunk/src/modules/lapack/$f"
          done
          gfortran -Q --help=target -march=native | grep -E '^\s+-march=' | head -1 | tee -a cpu.txt
          cd work && bash ../tests/flags-build.sh ../src "$rhome"

      - name: Compare results and timings
        id: compare
        run: |
          rhome=$(cygpath -u "$R_HOME_DIR")
          bin=$rhome/bin/x64
          cp "$bin/Rblas.dll" work/Rblas-cran.dll; cp "$bin/Rlapack.dll" work/Rlapack-cran.dll
          # every comparison must run, and the builds with R's flags must
          # reproduce CRAN's results ("same": test-flags.R exits 1 otherwise);
          # differences under other flags are the results
          failed=
          run() {  # label, Rblas.dll, Rlapack.dll, [same]
            cp "$2" "$bin/Rblas.dll" && cp "$3" "$bin/Rlapack.dll" || { failed="$failed; $1"; return; }
            "$rhome/bin/Rscript" tests/test-flags.R cmp "$1" $4 2>&1 | tee -a flags.log || failed="$failed; $1"
          }
          "$rhome/bin/Rscript" tests/test-flags.R ref "CRAN" 2>&1 | tee flags.log || exit 1
          w=work
          run "BLAS R's flags (-O2)" $w/blas-R/Rblas.dll $w/Rlapack-cran.dll same
          run "BLAS -O3"             $w/blas-O3/Rblas.dll $w/Rlapack-cran.dll
          run "BLAS native -O2"      $w/blas-native-O2/Rblas.dll $w/Rlapack-cran.dll
          run "BLAS native -O3"      $w/blas-native-O3/Rblas.dll $w/Rlapack-cran.dll
          run "LAPACK R's flags (-O3)" $w/Rblas-cran.dll $w/lapack-R/Rlapack.dll same
          run "LAPACK -O2"           $w/Rblas-cran.dll $w/lapack-O2/Rlapack.dll
          run "LAPACK native -O2"    $w/Rblas-cran.dll $w/lapack-native-O2/Rlapack.dll
          run "LAPACK native -O3"    $w/Rblas-cran.dll $w/lapack-native-O3/Rlapack.dll
          run "both native -O2"      $w/blas-native-O2/Rblas.dll $w/lapack-native-O2/Rlapack.dll
          run "both native -O3"      $w/blas-native-O3/Rblas.dll $w/lapack-native-O3/Rlapack.dll
          run "CRAN again"           $w/Rblas-cran.dll $w/Rlapack-cran.dll same
          cp $w/Rblas-cran.dll "$bin/Rblas.dll"; cp $w/Rlapack-cran.dll "$bin/Rlapack.dll"
          # timings as a table, seconds, operations by build; Rscript -e on
          # Windows does not take a program over several lines
          "$rhome/bin/Rscript" tests/test-flags.R table flags.log > timings.txt 2>&1
          cat timings.txt
          [ -z "$failed" ] || { echo "::error::failed or not as CRAN's results: ${failed#; }"; exit 1; }

      - name: Summarise
        id: summarise
        if: always()
        shell: bash
        run: |
          set +e
          { cat cpu.txt; grep -v '|' flags.log; echo; cat timings.txt; } > summary.log 2>/dev/null
          # the verdict from the counts test-flags.R wrote: label, differing, results
          if [ -s flags.tsv ]; then
            d=$(tr -d '\r' < flags.tsv | awk -F'\t' '$2 > 0 {printf "%s%s", s, $1; s = ", "}')
            echo "verdict=$(wc -l < flags.tsv) builds compared; differing from CRAN's results: ${d:-none}" >> $GITHUB_OUTPUT
          fi
          { echo "$(Rscript -e 'cat(R.version.string)' 2>/dev/null), its Rblas.dll and Rlapack.dll rebuilt from its sources"; cat cpu.txt 2>/dev/null; } > ran.txt
          tr -d '\r' < flags.tsv 2>/dev/null | awk -F'\t' '{printf "%-26s %d of %d results differ from the reference\n", $1, $2, $3}' > results.txt

      - uses: ./.github/actions/report
        if: always()
        with:
          status: ${{ job.status }}
          verdict: ${{ steps.summarise.outputs.verdict }}
          ran: ran.txt
          checks: |
            ${{ steps.build.outcome }} | DLLs built
            ${{ steps.compare.outcome }} | 11 builds compared, R's flags reproduce CRAN's results
          results: results.txt
          files: |
            Results and timings: summary.log
            flags.log
