name: R with the R-core scripts

# Builds R-devel, R-patched or R-release and its installer with the
# R-core scripts from R-dev-web
# (WindowsBuilds/winutf8/ucrt3/r): setup.ps1 installs Inno Setup, MiKTeX,
# qpdf, Ghostscript and MSYS2, and build.sh --check unpacks the toolchain
# tarball and the Tcl/Tk bundle, checks out R, applies the r_*.diff
# patches, runs make distribution and then make check-devel and check-all.
# Added here: the FlexiBLAS bundle from the latest successful run of
# build-bundle.yml, patches/r as further r_*.diff, and patches/r-dev-web
# applied to a mirror of WindowsBuilds: 0001, after which build.sh uses
# the bundle when present, and 0002, without which build.sh --patched
# checks out no branch.
# build.sh builds trunk or the R-patched branch; for release, the branch
# in the checkout line is replaced by the latest R-x-y-z tag of the
# release series, since R-core builds release in another way.
# The test job then installs the installer and runs tests/ against it.
# Long, so it runs only on demand.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: FlexiBLAS backend for the build and checks
        default: OPENBLAS-OPENMP
      experiment:
        description: "Rblas -O3: R without FlexiBLAS, its own BLAS built with -O3 (patches/experiments/rblas-O3.diff); no test job"
        type: choice
        options: [none, Rblas -O3]
        default: none
      r:
        description: The R to build, and to test against CRAN's build of the same
        type: choice
        options: [devel, patched, release]
        default: devel
      build:
        description: Build R; otherwise test the installer of the latest successful run
        type: boolean
        default: true
      check:
        description: Run make check-devel and check-all (build.sh --check)
        type: boolean
        default: true
      target:
        description: "x86_64 on windows-2025, or aarch64 natively on windows-11-arm (build.sh aarch64, the LLVM toolchain)"
        type: choice
        options: [x86_64, aarch64]
        default: x86_64

permissions:
  actions: read
  contents: read
  issues: write

env:
  RDEVWEB: https://svn.r-project.org/R-dev-web/trunk/WindowsBuilds
  # the Tcl/Tk bundle revision; the MXE revision is the one the bundle is
  # built with, MXE_REV in docker/Dockerfile (step "Toolchain names")
  TCLREV: 6663
  # the bundle artifact of build-bundle.yml for the target, and R's bin
  # directory (bin on aarch64, where R_ARCH is empty)
  BUNDLE: ${{ inputs.target == 'aarch64' && 'flexiblas-rwin-aarch64' || 'flexiblas-rwin' }}
  RBIN: ${{ inputs.target == 'aarch64' && 'bin' || 'bin/x64' }}
  # artifact names carry the target
  SUFFIX: ${{ inputs.target == 'aarch64' && '-aarch64' || '' }}

jobs:
  build:
    if: inputs.build
    runs-on: ${{ inputs.target == 'aarch64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CRAN's toolchain tarball and Tcl/Tk bundle for Rtools45 for the
      # target, of the MXE revision the bundle is built with, and the names
      # build.sh looks for them under
      - name: Toolchain names
        shell: bash
        run: |
          rev=$(sed -n 's/^ARG MXE_REV=\([0-9][0-9]*\).*/\1/p' docker/Dockerfile)
          [ -n "$rev" ] || { echo "::error::no MXE_REV in docker/Dockerfile"; exit 1; }
          if [ "${{ inputs.target }}" = aarch64 ]; then
            echo "TOOLCHAIN=rtools45-toolchain-libs-full-aarch64-$rev.tar.zst" >> $GITHUB_ENV
            echo "TCLTK=tcltk-aarch64-$rev-$TCLREV.zip" >> $GITHUB_ENV
            echo "TOOLCHAIN_AS=llvm19_ucrt3_full_aarch64_$rev.tar.zst" >> $GITHUB_ENV
            echo "TCLTK_AS=Tcl-aarch64-$rev-$TCLREV.zip" >> $GITHUB_ENV
          else
            echo "TOOLCHAIN=rtools45-toolchain-libs-full-$rev.tar.zst" >> $GITHUB_ENV
            echo "TCLTK=tcltk-$rev-$TCLREV.zip" >> $GITHUB_ENV
            echo "TOOLCHAIN_AS=gcc14_ucrt3_full_$rev.tar.zst" >> $GITHUB_ENV
            echo "TCLTK_AS=Tcl-$rev-$TCLREV.zip" >> $GITHUB_ENV
          fi

      # The bundle from the latest successful build-bundle.yml run on master,
      # which must include the last change to the bundle's sources, the
      # paths that start build-bundle.yml.
      - name: Find the bundle
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R $env:GITHUB_REPOSITORY -w build-bundle.yml -b master -s success -L 1 --json databaseId,headSha | ConvertFrom-Json
          $id = $run[0].databaseId; $sha = $run[0].headSha
          $in = $false; $paths = @()
          foreach ($l in Get-Content .github/workflows/build-bundle.yml) {
            if ($l -match 'paths: &inputs') { $in = $true; continue }
            if ($in) { if ($l -match '^\s+- (\S+)$') { $paths += ($matches[1] -replace '/\*\*$', '') } else { break } }
          }
          if ($paths.Count -eq 0) { Write-Output "::error::no paths in build-bundle.yml"; exit 1 }
          $last = git log -1 --format=%H -- @paths
          git merge-base --is-ancestor $last $sha
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Bundle::run $id (commit $sha) predates $last, the last change to the bundle's sources"
            exit 1
          }
          "run_id=$id" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "bundle: build-bundle.yml run $id, commit $sha" | Tee-Object -FilePath C:\bundle.txt

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUNDLE }}
          path: dist
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      # The files patches/r-dev-web touches, in their places under
      # WindowsBuilds, so that the patches apply as they would to R-dev-web
      # (the howtos only to check that they still apply), and the ucrt3/r
      # directory copied to C:\rbuild, where build.sh runs.
      - name: Fetch R-core's scripts and patches
        shell: pwsh
        run: |
          # build.sh applies r_*.diff_aarch64 in place of its namesake on aarch64 only
          foreach ($f in "winutf8/ucrt3/r/setup.ps1", "winutf8/ucrt3/r/build.sh", "winutf8/ucrt3/r/build_in_docker.sh", "winutf8/ucrt3/r/r_001_ucrt3_package_patches_and_repo.diff", "winutf8/ucrt3/r/r_001_ucrt3_package_patches_and_repo.diff_aarch64", "winutf8/ucrt3/r/r_002_rtools45.diff", "winutf8/ucrt3/howto.md", "R-devel/howto.md") {
            New-Item -ItemType Directory -Force (Split-Path "C:\rdw\$f") | Out-Null
            $r = Invoke-WebRequest "$env:RDEVWEB/$f" -OutFile "C:\rdw\$f" -UseBasicParsing -PassThru
            # the ETag of svn names the revision the file last changed in
            "R-dev-web $f r$(([string]$r.Headers.ETag).Trim('"').Split('/')[0])" | Out-File -Append -Encoding utf8 C:\bundle.txt
          }
          Get-ChildItem -Recurse -File C:\rdw

      - name: Apply patches/r-dev-web
        shell: bash
        run: |
          cd /c/rdw
          for p in "$GITHUB_WORKSPACE"/patches/r-dev-web/*.patch; do
            patch -p0 < "$p"
          done
          # jrsoftware.org/download.php, setup.ps1's source for Inno Setup,
          # now redirects to the downloads page; the same 6.4.1 is on GitHub
          sed -i 's#https://jrsoftware.org/download.php/is.exe?site=2#https://github.com/jrsoftware/issrc/releases/download/is-6_4_1/innosetup-6.4.1.exe#' winutf8/ucrt3/r/setup.ps1
          grep -n 'innosetup-6.4.1.exe"' winutf8/ucrt3/r/setup.ps1
          cp -r winutf8/ucrt3/r /c/rbuild
          ls -la /c/rbuild

      # setup.ps1 installs MSYS2 and the packages build.sh needs only when
      # C:\msys64 does not exist, and the runner image has its own there.
      - name: Move the runner's MSYS2 aside
        shell: pwsh
        run: Rename-Item C:\msys64 C:\msys64-runner

      # In a process of its own, as when run by hand: the step's shell sets
      # $ErrorActionPreference to Stop, which turns errors setup.ps1 lives
      # with into fatal ones.
      - name: Run setup.ps1
        id: setup
        timeout-minutes: 15
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File C:\rbuild\setup.ps1 *> C:\rbuild\setup.log
          "setup.ps1 exit status $LASTEXITCODE" | Tee-Object -Append C:\rbuild\setup.log
          Get-Content C:\rbuild\setup.log -Tail 20
          if (-not (Test-Path C:\msys64\usr\bin\bash.exe)) { exit 1 }

      - uses: actions/cache@v4
        with:
          path: cache
          key: ${{ env.TOOLCHAIN }}-${{ env.TCLTK }}

      - name: Toolchain tarball and Tcl/Tk bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cache | Out-Null
          foreach ($f in $env:TOOLCHAIN, $env:TCLTK) {
            if (-not (Test-Path "cache\$f")) {
              Invoke-WebRequest "https://cran.r-project.org/bin/windows/Rtools/rtools45/files/$f" -OutFile "cache\$f" -UseBasicParsing
            }
          }
          Copy-Item "cache\$env:TOOLCHAIN" "C:\rbuild\$env:TOOLCHAIN_AS"
          Copy-Item "cache\$env:TCLTK" "C:\rbuild\$env:TCLTK_AS"

      - name: Add the FlexiBLAS bundle and the patches
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        env:
          CHERE_INVOKING: 1
        run: |
          w=$(cygpath -u "$GITHUB_WORKSPACE")
          i=100
          for p in "$w"/patches/r/*.patch; do
            i=$((i + 1))
            cp "$p" "/c/rbuild/r_${i}_$(basename "$p" .patch).diff"
          done
          if [ "${{ inputs.experiment }}" = "Rblas -O3" ]; then
            # R's own BLAS, built with -O3 instead of -O2 (r76787)
            cp "$w/patches/experiments/rblas-O3.diff" /c/rbuild/r_201_rblas-O3.diff
          else
            # FlexiBLAS.zip or FlexiBLAS-aarch64.zip, the names build.sh looks for
            z=$(find "$w/dist" -name 'FlexiBLAS*.zip' | head -1); cp "$z" "/c/rbuild/$(basename "$z")"
          fi
          cd /c/rbuild
          if [ "${{ inputs.r }}" = release ]; then
            tag=$(svn ls https://svn.r-project.org/R/tags | grep -E '^R-[0-9]+-[0-9]+-[0-9]+/$' | sort -t- -k2,2n -k3,3n -k4,4n | tail -1 | tr -d /)
            echo "release tag $tag"
            sed -i "s#branches/\${BNAME} patched#tags/$tag patched#" build.sh
            grep -n "tags/$tag" build.sh
          fi
          ls -la

      - name: Run build.sh --check
        id: buildsh
        shell: C:\msys64\usr\bin\bash.exe --login {0}
        env:
          CHERE_INVOKING: 1
          FLEXIBLAS: ${{ inputs.backend }}
        working-directory: C:\rbuild
        run: |
          ./build.sh ${{ inputs.target == 'aarch64' && 'aarch64' || '' }} ${{ inputs.check && '--check' || '' }} ${{ inputs.r != 'devel' && '--patched' || '' }} > build.log 2>&1
          status=$?
          tail -30 build.log
          ls -la build
          # build.sh goes on after errors and pipes make through tee, so its
          # products decide: patches/r all in the tree (each reverses
          # cleanly, which fails also for a missing file; build.sh does not
          # check patch's status), the installer, and checks without make
          # errors
          d=$(ls -d trunk patched 2>/dev/null | head -1)
          if [ -z "$d" ]; then r="not run, no R tree"; status=1
          else
            bad=$(cd $d && for p in ../r_1[0-9][0-9]_*.diff; do patch --binary --dry-run -R -s -f -p0 < $p > /dev/null 2>&1 || echo ${p#../}; done)
            r=ok; [ -z "$bad" ] || { r="not applied: $(echo $bad)"; echo "::error::$r"; status=1; }
          fi
          echo "patches=$r" >> $GITHUB_OUTPUT
          r=ok; ls build/R-*-win.exe > /dev/null 2>&1 || { echo "::error::no installer"; status=1; r=missing; }
          echo "installer=$r" >> $GITHUB_OUTPUT
          if [ "${{ inputs.check }}" = true ]; then
            for f in build/checkdevel.out build/checkall.out; do
              r=ok
              if [ ! -f "$f" ]; then echo "::error::$f missing"; status=1; r=missing
              elif grep -n 'make.*\*\*\*' "$f"; then echo "::error::make errors in $f"; status=1; r=failed; fi
              n=${f##*/}; echo "${n%.out}=$r" >> $GITHUB_OUTPUT
            done
          fi
          exit $status

      # The installer, installed silently into a fresh directory: FlexiBLAS's
      # DLLs, backends and configuration must come with it.
      - name: Install R from the installer
        id: install
        timeout-minutes: 15
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        env:
          CHERE_INVOKING: 1
        run: |
          exec > >(tee /c/rbuild/install.log) 2>&1
          # build.sh names the release installer as the patched one
          /c/rbuild/build/R-${{ inputs.r == 'devel' && 'devel' || 'patched' }}-win.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //CURRENTUSER //DIR='C:\R-inst'
          if [ "${{ inputs.experiment }}" = none ]; then
            ls /c/R-inst/$RBIN/flexiblas /c/R-inst/etc
            for b in NETLIB OPENBLAS-OPENMP OPENBLAS-THREADS; do
              FLEXIBLAS=$b /c/R-inst/bin/Rscript -e 'cat(extSoftVersion()[["BLAS"]], La_library(), sep = "\n")'
            done
          else
            /c/R-inst/bin/Rscript -e 'sessionInfo()'
          fi

      # The installer under a name that says which R it is, so that a run
      # that only tests finds one of the right kind; an experiment's
      # installer has no FlexiBLAS and is never tested.
      - uses: actions/upload-artifact@v7
        with:
          name: R-${{ inputs.r }}${{ inputs.experiment != 'none' && '-experiment' || '' }}-installer${{ env.SUFFIX }}
          path: C:/rbuild/build/R-*-win.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: R-${{ inputs.r }}${{ inputs.experiment != 'none' && '-experiment' || '' }}-logs${{ env.SUFFIX }}
          path: |
            C:/rbuild/build/*.out
            C:/rbuild/*.log
          if-no-files-found: ignore

      - name: Summarise
        if: always()
        shell: bash
        run: |
          # a report, not a check: a missing file is not a failure (with
          # bash -e, a loop ending in a false test would end the step)
          set +e
          b=/c/rbuild
          # what was checked and how it came out
          {
            echo "R-${{ inputs.r }}$([ -f $b/build/svn_revision ] && echo " r$(cat $b/build/svn_revision)") for ${{ inputs.target }}, checks with FLEXIBLAS=${{ inputs.backend }}${{ inputs.experiment != 'none' && format(', experiment {0}', inputs.experiment) || '' }}"
            cat /c/bundle.txt 2>/dev/null
            echo "toolchain $TOOLCHAIN, Tcl/Tk $TCLTK"
            echo
            printf '%-32s %s\n' "setup.ps1" "${{ steps.setup.outcome }}" \
              "build.sh, patches/r applied" "${{ steps.buildsh.outputs.patches || steps.buildsh.outcome }}" \
              "build.sh, installer" "${{ steps.buildsh.outputs.installer || steps.buildsh.outcome }}" \
              "make check-devel" "${{ steps.buildsh.outputs.checkdevel || 'not run' }}" \
              "make check-all" "${{ steps.buildsh.outputs.checkall || 'not run' }}" \
              "installer installs, R reports" "${{ steps.install.outcome }}"
            for f in checkdevel.out checkall.out; do
              [ -f $b/build/$f ] && echo "$f: $(grep -c '^Status: OK' $b/build/$f) OK, $(grep -c '^Status: .*NOTE' $b/build/$f) with NOTEs, $(grep -c '^Status: .*WARNING' $b/build/$f) with WARNINGs, $(grep -c '^Status: .*ERROR' $b/build/$f) with ERRORs"
            done
            # what the NOTEs of the recommended packages say (check-devel
            # checks no package): each checking line that ended in NOTE, and
            # how often, then the first lines under it
            if [ -f $b/build/checkall.out ]; then
              echo "checkall.out, checks with a NOTE:"
              grep -E '^\* checking .* NOTE[[:space:]]*$' $b/build/checkall.out | sort | uniq -c | sed 's/^/  /'
            fi
            [ -f $b/build/checkall.out ] && grep -A3 -E '^\* checking .* NOTE[[:space:]]*$' $b/build/checkall.out | head -40 | sed 's/^/  /'
          } > summary.log
          # the errors themselves, and nothing that only looks like one
          {
            if [ -f $b/setup.log ]; then
              echo "setup.log (errors):"
              grep -v 'DEBUG:' $b/setup.log | sed -e 's/\x1b\[[0-9;]*m//g' | grep -i -E 'exit status|error|exception|denied' | grep -v -E '^gpg:' | head -20
            fi
            if [ -f $b/build.log ]; then
              echo "build.log (errors):"
              grep -n -E '^Error( in|:)|^ERROR|error: |\*\*\* \[|not available' $b/build.log | head -20
              echo "build.log (tail):"; tail -15 $b/build.log
            fi
            for f in checkdevel.out checkall.out; do
              [ -f $b/build/$f ] && { echo "$f (errors):"; grep -n -E '^Error( in|:)|^ERROR|\*\*\* \[|^Status: .*(ERROR|WARNING)' $b/build/$f | head -20; }
              # the lines before the first error, to see which test it was
              [ -f $b/build/$f ] && { n=$(grep -n -m1 -E '^Error( in|:)|^ERROR' $b/build/$f | cut -d: -f1); [ -n "$n" ] && { echo "$f, before line $n:"; sed -n "$((n > 25 ? n - 25 : 1)),${n}p" $b/build/$f; }; }
            done
            for f in $(find $b/trunk/tests $b/trunk/src/library $b/patched/tests $b/patched/src/library -name '*.Rout.fail' 2>/dev/null); do
              echo "== $f"
              tail -15 "$f"
            done
          } > errors.log
          cat summary.log errors.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (${{ inputs.r }}${{ inputs.experiment != 'none' && format(', {0}', inputs.experiment) || '' }}${{ env.SUFFIX && format(', {0}', inputs.target) || '' }})
          status: ${{ job.status }}
          summary: summary.log
          files: |
            Errors: errors.log
            Installation: /c/rbuild/install.log

  # The installer from the build job, tested as the old "Build and test"
  # tested CRAN's R with the forwarders copied in. CRAN's build of the same
  # R (R-devel against R-devel, R-patched against R-patched, R-release
  # against R-release), with
  # R's own BLAS and LAPACK, gives the reference results.
  test:
    name: Test the installed R
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && inputs.experiment == 'none'
    timeout-minutes: 160
    runs-on: ${{ inputs.target == 'aarch64' && 'windows-11-arm' || 'windows-2025' }}
    steps:
      - uses: actions/checkout@v7

      - name: Find the latest installer of the same R
        id: prev
        if: ${{ !inputs.build }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=R-${{ inputs.r }}-installer$env:SUFFIX&per_page=20" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id'
          if (-not $id) { throw "no R-${{ inputs.r }}-installer$env:SUFFIX; build one first" }
          "run_id=$id" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          name: R-${{ inputs.r }}-installer${{ env.SUFFIX }}
          path: inst
          run-id: ${{ steps.prev.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: r-lib/actions/setup-r@v2
        with:
          # "next" is R-patched
          r-version: ${{ inputs.r == 'patched' && 'next' || inputs.r }}
          rtools-version: '45'

      # On aarch64 the runner image also has an emulated x86_64 R, and
      # setup-r resolves devel to a community build: the reference must be
      # the architecture under test.
      # Steps with several commands run in bash (-e, pipefail), where the
      # first failure is the step's; a pwsh step reports only its last
      # command.
      - name: Reference results with CRAN's build of the same R, with R's own BLAS and LAPACK
        id: ref
        timeout-minutes: 5
        shell: bash
        run: |
          Rscript -e "sessionInfo()"
          Rscript -e "stopifnot(identical(R.version[['arch']], '${{ inputs.target == 'aarch64' && 'aarch64' || 'x86_64' }}'))"
          Rscript -e "cat(R.home('bin'))" > ref-bin.txt
          Rscript tests/test-nan.R propagate ref
          Rscript tests/test-identical.R ref
          Rscript tests/test-chol.R "R's own" 2>&1 | tee chol.log

      - name: Install R from the installer
        id: install
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = (Get-ChildItem inst -Recurse -Filter "R-*-win.exe")[0].FullName
          & $exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=C:\R-inst | Out-Null
          Get-ChildItem "C:\R-inst\$env:RBIN\flexiblas", C:\R-inst\etc\flexiblasrc*
          "C:\R-inst\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Rblas.dll and Rlapack.dll export what CRAN's do, less the LAPACK
      # names FlexiBLAS lacks (tests/compare-exports.sh)
      - name: Exports of Rblas.dll and Rlapack.dll against CRAN's R
        id: exports
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          bash tests/compare-exports.sh \
            ${{ inputs.target == 'aarch64' && '/c/rtools45-aarch64/aarch64-w64-mingw32.static.posix/bin/llvm-objdump.exe' || '/c/rtools45/x86_64-w64-mingw32.static.posix/bin/objdump.exe' }} \
            "$(cygpath -u "$(cat ref-bin.txt)")" /c/R-inst/$RBIN 2>&1 | tee exports.log

      - name: chol() with non-finite input
        id: chol
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          for b in NETLIB OPENBLAS-OPENMP OPENBLAS-THREADS; do
            FLEXIBLAS=$b Rscript tests/test-chol.R 2>&1 | tee -a chol.log
          done

      - name: Install the flexiblas R package, patched for Windows
        id: pkg
        timeout-minutes: 10
        shell: bash
        run: |
          exec > >(tee pkg-install.log) 2>&1
          set -x
          git -c core.autocrlf=false clone -q --depth 1 https://github.com/Enchufa2/r-flexiblas.git
          echo "r-flexiblas $(git -C r-flexiblas rev-parse HEAD)" | tee r-flexiblas.txt
          git -C r-flexiblas apply -v ../patches/r-flexiblas/0001-windows.patch
          Rscript -e "install.packages('tinytest', repos = 'https://cloud.r-project.org')"
          R CMD INSTALL --install-tests r-flexiblas
          Rscript -e "stopifnot(requireNamespace('flexiblas'))"

      - name: Startup with verbose FlexiBLAS
        id: startup
        timeout-minutes: 5
        shell: pwsh
        env:
          FLEXIBLAS_VERBOSE: 1
        run: Rscript -e "sessionInfo()" 2>&1 | Tee-Object -FilePath startup.log

      - name: Run tests
        id: tests
        timeout-minutes: 15
        shell: pwsh
        run: |
          Rscript tests/test-flexiblas.R 2>&1 | Tee-Object -FilePath tests.log
          exit $LASTEXITCODE

      - name: Run tests with OMP_NUM_THREADS=1
        id: tests_omp1
        if: always()
        timeout-minutes: 8
        shell: pwsh
        env:
          # Checks patches/openblas/0001-explicit-thread-count.patch: without
          # it, an explicit count above OMP_NUM_THREADS deadlocks.
          OMP_NUM_THREADS: 1
        run: |
          Rscript tests/test-flexiblas.R 2>&1 | Tee-Object -FilePath tests-omp1.log
          exit $LASTEXITCODE

      - name: Run tests with OMP_THREAD_LIMIT=1
        id: tests_limit1
        if: always()
        timeout-minutes: 8
        shell: pwsh
        env:
          # Checks patches/openblas/0002-thread-limit.patch: without it, an
          # explicit count above OMP_THREAD_LIMIT deadlocks in the OpenMP
          # build.  The pthreads build is outside the variable (see the test).
          OMP_THREAD_LIMIT: 1
        run: |
          Rscript tests/test-flexiblas.R 2>&1 | Tee-Object -FilePath tests-limit1.log
          exit $LASTEXITCODE

      - name: NA/NaN/Inf propagation through FlexiBLAS backends
        id: nan
        if: always()
        timeout-minutes: 5
        # against R's own, saved by the reference step; without it test-nan.R
        # would compare with the first backend
        shell: bash
        run: |
          [ -f nan-ref.rds ] || { echo "::error::no nan-ref.rds from the reference step"; exit 1; }
          Rscript tests/test-nan.R propagate cmp 2>&1 | tee nan.log

      # chol() and solve() must reach the backend as dpotrf and dgesv, with
      # no dgemm or dtrsm, which R's reference LAPACK on top of the FlexiBLAS
      # BLAS would call, and the one dsyrk of crossprod()
      - name: Check that LAPACK calls reach FlexiBLAS
        id: profile
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          FLEXIBLAS_HOOK: PROFILE
          FLEXIBLAS_PROFILE_FILE: ${{ github.workspace }}\profile.txt
        run: |
          Rscript tests/test-profile.R
          [ -f profile.txt ] || { echo "no profile written"; exit 1; }
          awk '$1 == "#" || $2 != 0' profile.txt > profile-nonzero.log
          cat profile-nonzero.log
          calls() { awk -v f="$1" '$1 == f {n += $2} END {print n + 0}' profile.txt; }
          fail=0
          for e in dpotrf:1 dgesv:1 dsyrk:1 dgemm:0 dtrsm:0; do
            n=$(calls ${e%:*}); echo "${e%:*}: $n calls, ${e#*:} expected"
            [ "$n" = "${e#*:}" ] || fail=1
          done
          exit $fail

      - name: NETLIB gives bit for bit the results of R's own BLAS and LAPACK
        id: identical
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          Rscript tests/test-identical.R cmp 2>&1 | Tee-Object -FilePath identical.log
          exit $LASTEXITCODE

      - name: Backend selection by environment and user configuration
        id: backends
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          exec > >(tee backends.log) 2>&1
          cur() { Rscript -e 'cat(flexiblas::flexiblas_current_backend())'; }
          fail=0
          check() { printf '%-45s %s\n' "$1" "$2"; [ "$2" = "$3" ] || { echo "  expected $3"; fail=1; }; }
          check "default" "$(cur)" NETLIB
          check "FLEXIBLAS=OPENBLAS-OPENMP" "$(FLEXIBLAS=OPENBLAS-OPENMP cur)" OPENBLAS-OPENMP
          u="$(cygpath -u "$APPDATA")/flexiblasrc"
          printf 'default = OPENBLAS-THREADS\n' > "$u"
          check "user config %APPDATA%\\flexiblasrc: default = OPENBLAS-THREADS" "$(cur)" OPENBLAS-THREADS
          check "  overridden by FLEXIBLAS=NETLIB" "$(FLEXIBLAS=NETLIB cur)" NETLIB
          rm "$u"
          exit $fail

      # A measurement, but a crash or a hang (the 64-thread product is the
      # one place where a count above the core count reaches dgemm) fails
      # the step and the job.
      - name: Memory use
        id: memory
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          for b in OPENBLAS-OPENMP OPENBLAS-THREADS; do
            Rscript tests/test-memory.R $b 2>&1 | tee -a memory.log
            OPENBLAS_NUM_THREADS=1 Rscript tests/test-memory.R $b 2>&1 | tee -a memory.log
            OMP_NUM_THREADS=1 Rscript tests/test-memory.R $b 2>&1 | tee -a memory.log
          done

      - name: BLAS called from OpenMP threads with a static libgomp
        id: ompcaller
        if: always()
        timeout-minutes: 10
        shell: bash
        # large calls, and many small ones, where a server that serialises
        # callers would show
        run: |
          Rscript tests/test-omp-caller.R 2>&1 | tee omp-caller.log
          Rscript tests/test-omp-caller.R 200 200 2>&1 | tee -a omp-caller.log
          Rscript tests/test-omp-caller.R 64 1000 2>&1 | tee -a omp-caller.log

      - name: R's BLAS regression tests under each backend
        id: regblas
        if: always()
        timeout-minutes: 15
        shell: bash
        run: |
          for b in NETLIB OPENBLAS-OPENMP OPENBLAS-THREADS; do
            echo "== $b" | tee -a reg-BLAS.log
            FLEXIBLAS=$b Rscript /c/R-inst/tests/reg-BLAS.R 2>&1 | tee -a reg-BLAS.log
          done

      # built with R CMD SHLIB and linked as a package is
      - name: Invalid arguments reach R's xerbla under each backend
        id: xerbla
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          Rscript tests/test-xerbla.R 2>&1 | tee xerbla.log
          test -f xerbla.ok || { echo "::error::test-xerbla.R did not finish"; exit 1; }

      # R CMD check --as-cran of packages that call the BLAS and LAPACK
      # (Matrix, MASS and four from CRAN with no dependencies beyond R and
      # the recommended packages) and one that does not (lattice), under
      # both Rs, the reference twice: the built R must add no NOTE,
      # WARNING or ERROR and no line of output (tests/check-packages.sh)
      - name: Package checks against CRAN's R
        id: pkgcheck
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 100
        shell: bash
        run: |
          bash tests/check-packages.sh "$(cygpath -u "$(cat ref-bin.txt)")" /c/R-inst/$RBIN \
            Matrix MASS lattice geigen kernlab fastICA gss 2>&1 | tee check-packages.log

      - name: Upload the package check logs
        if: always() && steps.pkgcheck.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: package-checks
          path: |
            chk-*/*.out
            chk-*/*.Rcheck/00check.log
            chk-*/*.Rcheck/00install.out
            chk-*/*.Rcheck/*-Ex.Rout
            chk-*/*.Rcheck/tests/*.Rout*
          if-no-files-found: ignore

      - name: The flexiblas package's own tests
        id: pkgtests
        if: always()
        timeout-minutes: 10
        shell: bash
        env:
          # They expect a threaded default backend.
          FLEXIBLAS: OPENBLAS-OPENMP
        # test_package() stops, and Rscript exits 1, when a test fails
        run: |
          Rscript -e "tinytest::test_package('flexiblas')" 2>&1 | tee pkg-tests.log

      # Every step's outcome, checks and measurements alike (a verdict is a
      # step outcome, never a pattern found in a log), then the one-line
      # results of the measurements with what is expected next to them, and
      # "not found" when a log lacks its line; the logs themselves are
      # collapsed in the report.
      - name: Summarise
        if: always()
        shell: bash
        run: |
          # a report, not a check: a missing line must not end the step
          set +e
          line() { grep -m1 "$2" "$1" 2>/dev/null || echo "not found in $1"; }
          {
            echo "$(Rscript -e 'cat(R.version.string)' 2>/dev/null), installer from run ${{ steps.prev.outputs.run_id || github.run_id }}, reference: CRAN's build of the same R"
            cat r-flexiblas.txt 2>/dev/null
            echo
            echo "Checks (the job fails if one fails):"
            printf '  %-58s %s\n' \
              "reference results from CRAN's R" "${{ steps.ref.outcome }}" \
              "installer installs" "${{ steps.install.outcome }}" \
              "Rblas/Rlapack export as CRAN's, less FlexiBLAS gaps" "${{ steps.exports.outcome }}" \
              "flexiblas package installs" "${{ steps.pkg.outcome }}" \
              "startup with FLEXIBLAS_VERBOSE=1" "${{ steps.startup.outcome }}" \
              "test-flexiblas.R: backends, errors vs NETLIB, thread counts" "${{ steps.tests.outcome }}" \
              "  the same with OMP_NUM_THREADS=1" "${{ steps.tests_omp1.outcome }}" \
              "  the same with OMP_THREAD_LIMIT=1 (OpenMP build caps at 1)" "${{ steps.tests_limit1.outcome }}" \
              "LAPACK calls reach the backend, no dgemm/dtrsm (profile)" "${{ steps.profile.outcome }}" \
              "NETLIB bit for bit R's own (test-identical.R)" "${{ steps.identical.outcome }}" \
              "backend selection: default, FLEXIBLAS, user flexiblasrc" "${{ steps.backends.outcome }}" \
              "R's reg-BLAS.R under each backend" "${{ steps.regblas.outcome }}" \
              "invalid arguments give R's xerbla error, each backend" "${{ steps.xerbla.outcome }}" \
              "R CMD check of 7 packages: no item or output line beyond CRAN's R" "${{ steps.pkgcheck.outcome }}" \
              "the package's tinytest suite" "${{ steps.pkgtests.outcome }}"
            echo
            echo "Measurements (the step fails only if a run crashes or hangs):"
            printf '  %-58s %s\n' \
              "chol() with non-finite input, per backend" "${{ steps.chol.outcome }}" \
              "NA/NaN/Inf propagation, backends vs R's own" "${{ steps.nan.outcome }}" \
              "memory use per backend and thread setting" "${{ steps.memory.outcome }}" \
              "dgemm from OpenMP threads with a static libgomp" "${{ steps.ompcaller.outcome }}"
            echo
            echo "  identical.log (0 expected): $(line identical.log 'results differ')"
            echo "  nan.log (6 expected: dpotrf at six sizes for the two OpenBLAS backends): $(line nan.log 'results differ')"
            n=$(grep -c 'NaN on the diagonal' chol.log 2>/dev/null)
            echo "  chol.log, NaN on the diagonal: ${n:-no} BLAS/LAPACK sets, $(grep -c 'NaN on the diagonal.*error:' chol.log 2>/dev/null) give an error (2 of 4 expected: R's own and NETLIB test the pivot with disnan(), OpenBLAS's dpotrf does not)"
            echo "  memory.log, private bytes after loading the backend:"
            awk '/^backend:/ {b = $2; ob = $5; om = $8} /loaded,/ {found = 1; printf "    %-18s OPENBLAS_NUM_THREADS=%-7s OMP_NUM_THREADS=%-7s %s threads, %s MB\n", b, ob, om, $3, $6} END {if (!found) print "    not found in memory.log"}' memory.log 2>/dev/null || echo "    not found in memory.log"
            echo "  omp-caller.log: process thread counts with as many OpenMP callers as cores and as many BLAS threads, n = 1000:"
            awk '/^cores:/ {c = $2; p = ($4 == 1000)} p && $2 == c && $3 == c {found = 1; printf "    %-18s %s threads, %s s\n", $1, $5, $4} END {if (!found) print "    not found in omp-caller.log"}' omp-caller.log 2>/dev/null || echo "    not found in omp-caller.log"
            echo "  tests.log, B %*% B at n = 3000 (s):"
            awk '/^== / {b = $2} /B %\*% B.*thread\(s\)/ {found = 1; for (i = 1; i <= NF; i++) if ($(i + 1) == "thread(s):") n = $i; printf "    %-18s %s threads: %s\n", b, n, $NF} END {if (!found) print "    not found in tests.log"}' tests.log 2>/dev/null || echo "    not found in tests.log"
          } > summary.log 2>&1
          cat summary.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (${{ inputs.r }}, test${{ env.SUFFIX && format(', {0}', inputs.target) || '' }})
          status: ${{ job.status }}
          summary: summary.log
          files: |
            startup.log
            tests.log
            tests-omp1.log
            tests-limit1.log
            reg-BLAS.log
            xerbla.log
            check-packages.log
            pkg-install.log
            pkg-tests.log
            profile-nonzero.log
            nan.log
            memory.log
            omp-caller.log
            backends.log
            identical.log
            exports.log
            chol.log

  # The test comment would otherwise keep the previous run's status when
  # the build fails and the test job is skipped.
  test-not-run:
    name: Test not run
    needs: [build, test]
    if: always() && needs.test.result == 'skipped' && inputs.experiment == 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: echo "not run; the build job ended with ${{ needs.build.result }}, so there was no installer to test" > summary.log
      - uses: ./.github/actions/report
        with:
          key: ${{ github.workflow }} (${{ inputs.r }}, test${{ env.SUFFIX && format(', {0}', inputs.target) || '' }})
          status: not run
          summary: summary.log
          files: summary.log
