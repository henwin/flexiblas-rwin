name: NA/NaN/Inf on Linux and macOS

# Cross-checks that the Windows results are not platform-specific. Runs only
# when the test changes, or by hand, to keep development runs short.
on:
  push:
    branches: [master]
    paths: [tests/test-nan.R, tests/test-memory.R, .github/workflows/platforms.yml]
  workflow_dispatch:

jobs:
  linux:
    name: Fedora, R linked to FlexiBLAS
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install R with FlexiBLAS and its backends
        run: |
          dnf install -y -q R-core R-flexiblas flexiblas-netlib binutils \
              flexiblas-openblas-serial flexiblas-openblas-openmp flexiblas-openblas-threads
          flexiblas list
          # OpenBLAS's build configuration, including MAX_THREADS (NUM_THREADS)
          for f in /usr/lib64/libopenblas*.so.0; do echo "$f: $(strings "$f" | grep -m1 'MAX_THREADS')"; done

      - name: Compare backends
        run: Rscript tests/test-nan.R cmp 2>&1 | tee nan.log

      - name: Memory use
        run: |
          for b in OPENBLAS-OPENMP OPENBLAS-THREADS; do
            Rscript tests/test-memory.R $b
            OPENBLAS_NUM_THREADS=1 Rscript tests/test-memory.R $b
          done 2>&1 | tee memory.log

      - name: Publish log as annotations
        if: always()
        run: |
          for f in nan.log memory.log; do
            [ -f $f ] || continue
            split -l 25 -d $f part-$f-
            for p in part-$f-*; do
              t=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::notice title=$f-linux (${p#part-$f-})::$t"
            done
          done

  macos:
    name: macOS arm64, R's BLAS against Accelerate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Reference with R's own BLAS
        run: Rscript tests/test-nan.R ref

      - name: Switch libRblas to Accelerate (vecLib) and compare
        run: |
          lib=$(Rscript -e 'cat(R.home("lib"))')
          ls -l "$lib"/libRblas*
          ln -sf libRblas.vecLib.dylib "$lib/libRblas.dylib"
          Rscript -e 'sessionInfo()' | grep -i -A2 blas
          Rscript tests/test-nan.R cmp 2>&1 | tee nan.log

      - name: Publish log as annotations
        if: always()
        run: |
          [ -f nan.log ] || exit 0
          split -l 25 nan.log part-
          for p in part-*; do
            t=$(perl -pe 's/%/%25/g; s/\n/%0A/' "$p")
            echo "::notice title=nan-macos.log (${p#part-})::$t"
          done
