name: R from source, make check-all

# Builds R from SVN with Rtools45, following R-core's "Building R and
# packages on Windows" howto, swaps in the FlexiBLAS
# forwarders from the latest successful "Build and test" run, and runs R's
# full test suite. Long, so it runs only on demand.
on:
  workflow_dispatch:
    inputs:
      svn_path:
        description: Path under https://svn.r-project.org/R/ (tags/R-4-6-1, branches/R-4-6-branch, trunk)
        default: tags/R-4-6-1
      backend:
        description: FlexiBLAS backend for the checks
        default: OPENBLAS

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      R_SRC: R-src
      CHERE_INVOKING: 1
    defaults:
      run:
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          install-r: false
          rtools-version: '45'

      - name: Find the latest successful build
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = gh run list -R $env:GITHUB_REPOSITORY -w build-test.yml -s success -L 1 --json databaseId --jq '.[0].databaseId'
          "run_id=$id" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          name: flexiblas-rwin
          path: dist
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      # MiKTeX (with inconsolata and tabu) and qpdf as in R-core's
      # winutf8/ucrt3/r/setup.ps1, so that manuals, vignettes and the Rd2pdf
      # and Sweave tests can run.
      - name: Install MiKTeX and qpdf
        shell: pwsh
        run: |
          Invoke-WebRequest https://miktex.org/download/ctan/systems/win32/miktex/setup/windows-x64/basic-miktex-24.1-x64.exe -OutFile basic-miktex.exe
          Start-Process -Wait -NoNewWindow -FilePath .\basic-miktex.exe -ArgumentList "--unattended --private --user-config=`"$env:APPDATA\MiKTeX`" --user-data=`"$env:LOCALAPPDATA\MiKTeX`" --user-install=`"$env:LOCALAPPDATA\Programs\MiKTeX`""
          $mt = "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64"
          & "$mt\initexmf.exe" --enable-installer
          & "$mt\initexmf.exe" --set-config-value=[MPM]AutoInstall=t
          & "$mt\mpm.exe" --update-db
          & "$mt\mpm.exe" --install=inconsolata
          & "$mt\mpm.exe" --install=tabu
          $mt | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Invoke-WebRequest https://github.com/qpdf/qpdf/releases/download/v11.9.1/qpdf-11.9.1-msvc64.zip -OutFile qpdf.zip
          Expand-Archive qpdf.zip -DestinationPath qpdf
          (Get-ChildItem qpdf -Directory | Select-Object -First 1).FullName + "\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Fetch the Tcl/Tk bundle
        shell: pwsh
        run: Invoke-WebRequest https://cran.r-project.org/bin/windows/Rtools/rtools45/files/tcltk-6768-6663.zip -OutFile tcltk.zip

      # As in R-core's howto: a full update first. MSYS2 does not support
      # partial updates; installing subversion alone pulled in a build
      # against a newer SQLite than the one installed.
      # The first pass may update the MSYS2 runtime itself and stop, asking
      # for a new shell; the second pass, in a new shell, does the rest.
      - name: Update MSYS2 in Rtools (core)
        continue-on-error: true
        run: pacman -Syuu --noconfirm > pacman.log 2>&1

      - name: Update MSYS2 in Rtools (rest)
        run: pacman -Syuu --noconfirm >> pacman.log 2>&1

      - name: Check out R from SVN
        run: |
          exec > >(tee svn.log) 2>&1
          set -x
          pacman -S --noconfirm --needed unzip diffutils make winpty rsync texinfo tar texinfo-tex zip subversion bison moreutils xz patch
          # Does R's SVN also answer on svn:// (svnserve, port 3690)?
          timeout 30 svn info svn://svn.r-project.org/R/trunk 2>&1 | head -3 || echo "svn:// not reachable"
          svn checkout -q "https://svn.r-project.org/R/${{ inputs.svn_path }}" "$R_SRC"
          svn info "$R_SRC" | grep -E '^(URL|Revision|Last Changed Date)'
          cd "$R_SRC" && unzip -q ../tcltk.zip

      - name: Build R
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PATH
          export TAR=/usr/bin/tar TAR_OPTIONS=--force-local
          cd "$R_SRC/src/gnuwin32"
          make rsync-recommended > ../../../build.log 2>&1
          # "all" and "recommended" in one parallel make race: recommended
          # needs MkRules, which "all" creates.
          { make -j4 all && make -j4 recommended && make cairodevices; } >> ../../../build.log 2>&1 \
              || { tail -60 ../../../build.log; exit 1; }
          ../../bin/R --version

      - name: Install FlexiBLAS into the built R
        run: |
          r=$R_SRC
          cp "$r/bin/x64/Rblas.dll" "$r/bin/x64/Rblas-reference.dll"
          cp "$r/bin/x64/Rlapack.dll" "$r/bin/x64/Rlapack_ref.dll"
          cp dist/*.dll "$r/bin/x64/"
          cp -r dist/flexiblas "$r/bin/x64/"
          cp -r dist/etc "$r/bin/etc"
          FLEXIBLAS=${{ inputs.backend }} "$r/bin/Rscript" -e 'cat(extSoftVersion()[["BLAS"]], La_library(), sep = "\n")'

      - name: make check-all
        env:
          FLEXIBLAS: ${{ inputs.backend }}
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PATH
          export TAR=/usr/bin/tar TAR_OPTIONS=--force-local
          cd "$R_SRC/src/gnuwin32"
          make -k check-all > ../../../check-all.log 2>&1 || echo "check-all exit status $?" >> ../../../check-all.log
          tail -60 ../../../check-all.log

      - name: Summarise failures
        if: always()
        run: |
          r=$R_SRC
          {
            echo "backend: ${{ inputs.backend }}"
            [ -f pacman.log ] && { echo "pacman.log:"; grep -i -E 'error|warning|conflict|restart|close' pacman.log | head -15; tail -8 pacman.log; }
            [ -f svn.log ] && { echo "svn.log:"; tail -25 svn.log; }
            [ -f build.log ] && { echo "build.log (errors and tail):"; grep -n -E 'Error|error:|\*\*\*' build.log | head -20; tail -25 build.log; }
            grep -E 'exit status|Error|FAILED|failed' check-all.log | head -40 || true
            for f in $(find "$r/tests" "$r/src/library" -name '*.Rout.fail' 2>/dev/null); do
              echo "== $f"
              tail -15 "$f"
            done
          } > summary.log
          cat summary.log
          split -l 30 -d summary.log part-
          for p in part-*; do
            t=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=check-all (${p#part-})::$t"
          done
