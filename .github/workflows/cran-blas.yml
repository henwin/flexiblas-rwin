name: CRAN packages with an -O3 Rblas.dll

# The examples and tests of the CRAN packages that call the BLAS or LAPACK
# themselves (tests/cran-blas-users.sh: a DLL in their Windows binary imports
# from Rblas.dll or Rlapack.dll), run with CRAN's R and its Rblas.dll and
# with a copy of R whose Rblas.dll is built with -O3 (r76787). The packages
# are CRAN's binaries, with the tests taken from their sources. As in
# optflags.yml, the reference runs twice, and only output lines on which both
# runs agree count (tests/compare-optflags.R).
on:
  workflow_dispatch:
    inputs:
      packages:
        description: CRAN packages, separated by spaces (empty for all that call the BLAS or LAPACK)
        default: ''
      groups:
        description: Number of parallel jobs (at most 256)
        default: '64'

env:
  OPTFLAGS_WORK: ${{ github.workspace }}\optflags-work

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.split.outputs.groups }}
    steps:
      - uses: actions/checkout@v7

      - name: Packages that call the BLAS or LAPACK
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            echo ${{ inputs.packages }} | tr ' ' '\n' > packages.txt
          else
            # the version of setup-r's "release"
            v=$(curl -sSf https://api.r-hub.io/rversions/resolve/release | jq -r .version | cut -d. -f1,2)
            tests/cran-blas-users.sh "$v" > packages.txt
          fi
          echo "$(wc -l < packages.txt) packages"

      - name: Split into groups
        id: split
        run: |
          n=$(wc -l < packages.txt); g=${{ inputs.groups }}; [ "$g" -gt "$n" ] && g=$n
          # round robin, so that groups get packages from the whole alphabet
          awk -v g="$g" '{a[NR % g] = a[NR % g] " " $1} END {for (i = 0; i < g; i++) print substr(a[i], 2)}' packages.txt |
            jq -R . | jq -sc . > groups.json
          echo "groups=$(cat groups.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages.txt

  packages:
    needs: select
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.groups) }}
    env:
      PKGS: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: Install the packages
        shell: bash
        run: Rscript tests/compare-optflags.R binary $PKGS 2>&1 | tee -a optflags.log

      - name: Run examples and tests
        shell: bash
        run: |
          # one package at a time, so that a package that hangs costs only its own time
          run() {   # run package
            R=Rscript; [ "${1:0:2}" = O3 ] && R=/c/R-o3/bin/Rscript
            timeout 1200 $R tests/compare-optflags.R test $1 default $2 > /dev/null 2>&1 ||
              echo "$2 $1: exit status $?" | tee -a optflags.log
          }
          for p in $PKGS; do for r in O2 O2b O3; do run $r $p; done; done
          Rscript tests/compare-optflags.R compare O2,O2b O3 2>&1 > pass1.log
          # Two runs of the reference can agree on a line by chance, a timing
          # that rounds to 0, say; a package with differences runs once more
          # each way, and a line counts only if all five runs bear it out.
          for p in $(awk '/^== .* output files:/ && $8 > 0 {print $2}' pass1.log); do
            run O2c $p; run O3b $p
          done
          Rscript tests/compare-optflags.R compare O2,O2b,O2c O3,O3b 2>&1 | tee -a optflags.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ strategy.job-index }}
          path: optflags.log

  summary:
    needs: packages
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          merge-multiple: false

      - name: Summarise
        run: |
          # the logs come from Windows; a carriage return would end an annotation
          cat log-*/optflags.log | tr -d '\r' > all.log
          {
            echo "packages compared: $(grep -ac '^== .* output files:' all.log)"
            echo "not installed: $(grep -ac ' not installed$' all.log)"
            echo "test runs that crashed or timed out: $(grep -ac ': exit status ' all.log)"
            echo "packages with a failed example or test file: $(grep -ac ': tests failed$' all.log)"
            # the per-package lines: "== pkg N output files: a same, b differ in O3, c failed, d missing, e unstable in ..."
            grep -a '^== .* output files:' all.log |
              awk '{s += $6; d += $8; f += $12; m += $14; u += $16} END {printf "output files: %d same, %d differ, %d failed in every run, %d missing, %d unstable between reference runs\n", s, d, f, m, u}'
            echo "packages with output files that differ with the -O3 Rblas.dll:"
            grep -a '^== .* output files:' all.log | awk '$8 > 0 {print "  " $2 ": " $8}'
          } > summary.txt
          cat summary.txt
          # the differing lines, at most 25 lines per annotation
          grep -aE '^(== |  \S+: |    O[23]: )' all.log | grep -av '^== .* output files' > detail.txt || true
          for f in summary.txt; do
            echo "::notice title=CRAN packages with an -O3 Rblas.dll::$(sed -e 's/%/%25/g' $f | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          done
          split -l 25 -d detail.txt part-
          for p in part-*; do
            echo "::notice title=Differences (${p#part-})::$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          done
          # the runs that failed or timed out (124), which run of which package
          grep -a ': exit status ' all.log | sort > failed.txt || true
          split -l 40 -d failed.txt failed-
          for p in failed-*; do
            echo "::notice title=Failed or timed out (${p#failed-})::$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            all.log
            summary.txt
