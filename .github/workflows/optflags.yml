name: Package flags and BLAS -O3 against outputs

# What -O3 changes in the output of examples and tests (see
# tests/compare-optflags.R), with plain R from CRAN and without FlexiBLAS.
#   "package flags": CRAN packages built with R's package flags (-O2) and
#     with -O3, as R would build them without the sed in
#     src/gnuwin32/fixed/Makefile (r57974).
#   "BLAS -O3": R's own tests and the packages' tests with R's Rblas.dll and
#     with one built from R's sources with -O3 instead of -O2 (r76787), in a
#     copy of the R installation.
# Each comparison counts only output lines on which two runs of the
# reference agree. Without packages, a sample of 32 packages with C, C++ or
# Fortran code and tests runs in four parallel groups.
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to compare
        type: choice
        options: [package flags, BLAS -O3]
        default: package flags
      packages:
        description: CRAN packages, separated by spaces (empty for the sample)
        default: ''

env:
  OPTFLAGS_WORK: ${{ github.workspace }}\optflags-work

jobs:
  packages:
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # the packages given, or the sample in four groups
        group: ${{ fromJSON(inputs.packages && format('["{0}"]', inputs.packages) || '["mvtnorm coin libcoin survival quantreg robustbase expm KernSmooth", "glmnet e1071 randomForest gss minqa deSolve fields mclust", "lme4 nlme MASS cluster mgcv nnet rpart class", "Matrix data.table zoo xts ranger spam Rfast polspline"]') }}
    env:
      PKGS: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        if: inputs.what == 'BLAS -O3'
        uses: ./.github/actions/rblas-o3

      - name: Build the packages
        shell: bash
        run: |
          Rscript tests/compare-optflags.R build O2 $PKGS 2>&1 | tee -a optflags.log
          if [ "${{ inputs.what }}" = "package flags" ]; then
            Rscript tests/compare-optflags.R build O3 $PKGS 2>&1 | tee -a optflags.log
          fi

      - name: Run examples and tests
        shell: bash
        run: |
          Rscript tests/compare-optflags.R test O2 O2 $PKGS 2>&1 | tee -a optflags.log
          Rscript tests/compare-optflags.R test O2b O2 $PKGS 2>&1 | tee -a optflags.log
          if [ "${{ inputs.what }}" = "package flags" ]; then
            Rscript tests/compare-optflags.R test O3 O3 $PKGS 2>&1 | tee -a optflags.log
          else
            /c/R-o3/bin/Rscript tests/compare-optflags.R test O3 O2 $PKGS 2>&1 | tee -a optflags.log
          fi
          Rscript tests/compare-optflags.R compare O2 O2b O3 2>&1 | tee -a optflags.log

      - name: Publish the comparison as annotations
        if: always()
        shell: bash
        run: |
          [ -f optflags.log ] || exit 0
          grep -E '^(\S+ +O[23]:|O[23]b?: |== |  \S+: |    O[23]: |running the tests)' optflags.log > summary.log || true
          split -l 25 -d summary.log part-
          for p in part-*; do
            t=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=${{ inputs.what }} ${{ strategy.job-index }} (${p#part-})::$t"
          done

  base:
    if: inputs.what == 'BLAS -O3'
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: '45'

      - name: R with Rblas.dll built with -O3
        uses: ./.github/actions/rblas-o3

      - name: R's tests
        shell: bash
        run: |
          Rscript tests/compare-optflags.R base O2 2>&1 | tee -a optflags.log
          Rscript tests/compare-optflags.R base O2b 2>&1 | tee -a optflags.log
          /c/R-o3/bin/Rscript tests/compare-optflags.R base O3 2>&1 | tee -a optflags.log
          Rscript tests/compare-optflags.R compare O2 O2b O3 2>&1 | tee -a optflags.log

      - name: Publish the comparison as annotations
        if: always()
        shell: bash
        run: |
          [ -f optflags.log ] || exit 0
          grep -E '^(O[23]b?: |test|== |  \S+: |    O[23]: )' optflags.log > summary.log || true
          split -l 25 -d summary.log part-
          for p in part-*; do
            t=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=R's tests (${p#part-})::$t"
          done
