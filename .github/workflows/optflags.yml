name: Packages built with -O2 and -O3

# Builds CRAN packages from source with R's package flags (-O2) and with
# -O3, and compares the outputs of their examples and tests (see
# tests/compare-optflags.R). Plain R from CRAN, without FlexiBLAS. Without
# input, a sample of packages with C, C++ or Fortran code and tests, in
# groups that run in parallel.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: CRAN packages, separated by spaces (empty for the sample)
        default: ''

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        group:
          - mvtnorm coin libcoin survival quantreg robustbase expm KernSmooth
          - glmnet e1071 randomForest gss minqa deSolve fields mclust
          - lme4 nlme MASS cluster mgcv nnet rpart class
          - Matrix data.table zoo xts ranger spam Rfast polspline
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: '45'

      - name: Build with -O2 and -O3 and compare
        shell: bash
        run: Rscript tests/compare-optflags.R ${{ inputs.packages || matrix.group }} 2>&1 | tee optflags.log

      - name: Publish the comparison as annotations
        if: always()
        shell: bash
        run: |
          [ -f optflags.log ] || exit 0
          grep -E '^(\S+ +O[23]:|== |  [O2bO3]+: |\S+\.Rout +([0-9]+ lines differ|\(missing\))| *[0-9]+ output files differ)' optflags.log > summary.log || true
          split -l 25 -d summary.log part-
          for p in part-*; do
            t=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=optflags ${{ strategy.job-index }} (${p#part-})::$t"
          done
