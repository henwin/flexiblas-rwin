name: OpenBLAS thread cases on Windows

# The thread-count cases behind patches/openblas/ (tests/omp-cases.sh)
# against the OpenBLAS backend of the bundle on Windows, with the test
# programs built by Rtools45 as a package's code would be: static libgomp,
# dlopen from dlfcn-win32.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  cases:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: C:\rtools45\usr\bin\bash.exe --login -o pipefail {0}
    env:
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The bundle from the latest successful build-test.yml run on master,
      # which must include the last change to the bundle's sources.
      - name: Find the bundle
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R $env:GITHUB_REPOSITORY -w build-test.yml -b master -s success -L 1 --json databaseId,headSha | ConvertFrom-Json
          $id = $run[0].databaseId; $sha = $run[0].headSha
          $last = git log -1 --format=%H -- docker scripts/build-mxe.sh scripts/build-bundle.sh scripts/build-in-docker.sh patches/rtools-mxe patches/openblas patches/flexiblas patches/r-dev-web/flexiblas_bundle
          git merge-base --is-ancestor $last $sha
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Bundle::run $id (commit $sha) predates $last, the last change to the bundle's sources"
            exit 1
          }
          "run_id=$id" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "bundle: build-test.yml run $id, commit $sha"

      - uses: actions/download-artifact@v8
        with:
          name: flexiblas-rwin
          path: dist
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          rtools-version: '45'

      - name: Run the cases against the OpenBLAS backend
        run: |
          # the backend may import from libflexiblas.dll, which the loader finds on PATH
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PWD/dist/FlexiBLAS/bin/x64:$PATH
          lib=$(ls dist/FlexiBLAS/bin/x64/flexiblas/*openblas*.dll)
          echo "backend: $lib"
          objdump -p "$lib" | grep -E ' (openblas_set_num_threads|dgemm_)$'
          bash tests/omp-cases.sh "$(cygpath -w "$lib")" 2>&1 | tee omp-cases.log

      - uses: ./.github/actions/report
        if: always()
        with:
          status: ${{ job.status }}
          files: omp-cases.log
