name: Rblas.dll with -O3, one package in detail

# For packages whose outputs differ with the -O3 Rblas.dll: is it -O3, or
# the rebuild itself? Rblas.dll is built from the installed R's sources with
# R's flags (-O2) and with -O3 (tests/blas-bitwise.sh compares them with
# CRAN's, routine by routine), each in a copy of the R installation, and
# R CMD check of the packages runs under CRAN's DLL (twice), the -O2
# rebuild and the -O3 rebuild, with tools::Rdiff of every output against
# the first run printed in full (tests/check-runs.sh).
on:
  workflow_dispatch:
    inputs:
      packages:
        description: CRAN packages, separated by spaces
        default: fastglmpca
      r:
        description: The R to test with, as CRAN builds it and its package binaries
        type: choice
        options: [devel, release]
        default: devel

permissions:
  contents: read
  issues: write

# runs that report to the same comment wait for each other rather than race
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: Locate R and its sources
        shell: pwsh
        run: |
          $h = Rscript -e "cat(normalizePath(R.home()))"
          "R_HOME_DIR=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $b = Rscript -e "v <- R.version; cat(if (startsWith(v[['status']], 'Under')) 'trunk' else sprintf('branches/R-%s-%s-branch', v[['major']], sub('[.].*', '', v[['minor']])))"
          $r = Rscript -e "cat(R.version[['svn rev']])"
          "R_SVN_PATH=$b" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "R_SVN_REV=$r" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # blas-bitwise.sh fails when the build with R's flags is not CRAN's
      # Rblas.dll, which would leave the probe without its premise
      - name: Build Rblas.dll with R's flags and with -O3, compare bit for bit
        id: bitwise
        shell: C:\rtools45\usr\bin\bash.exe --login -o pipefail {0}
        env:
          CHERE_INVOKING: 1
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PATH
          rhome=$(cygpath -u "$R_HOME_DIR")
          echo "sources: $R_SVN_PATH at r$R_SVN_REV"
          mkdir -p src work
          for f in blas.f blas2.f90 cmplxblas.f cmplxblas2.f90 Rblas.def; do
            curl -sSf -o "src/$f" "https://svn.r-project.org/R/$R_SVN_PATH/src/extra/blas/$f?p=$R_SVN_REV" || exit 1
          done
          cd work
          bash ../tests/blas-bitwise.sh ../src "$rhome" 2>&1 | tee ../blas-bitwise.log

      - name: The dependencies
        id: install
        shell: bash
        run: |
          Rscript tests/install-deps.R ${{ inputs.packages }} 2>&1 | tee install.log

      - name: R CMD check under each DLL
        id: runs
        shell: bash
        run: |
          h=$(cygpath -u "$R_HOME_DIR")
          for d in R2:work/blas-R.dll O3:work/blas-O3.dll; do
            cp -r "$h" /c/R-${d%%:*}; cp "${d#*:}" /c/R-${d%%:*}/bin/x64/Rblas.dll
          done
          bash tests/check-runs.sh cran1="$h/bin" cran2="$h/bin" r2=/c/R-R2/bin o3=/c/R-O3/bin -- \
            ${{ inputs.packages }} 2>&1 | tee probe.log

      - name: Summarise
        id: summarise
        if: always()
        shell: bash
        run: |
          { echo "$(Rscript -e 'cat(R.version.string)' 2>/dev/null), sources $R_SVN_PATH at r$R_SVN_REV"
            echo "packages: ${{ inputs.packages }}"; } > ran.txt
          { grep -E '^== |of 76 routines' blas-bitwise.log 2>/dev/null || echo "routines: not found in blas-bitwise.log"
            grep -E '^(cran1|cran2|r2|o3) ' probe.log || echo "no check status in probe.log"; } > results.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            probe.log
            install.log
            blas-bitwise.log
            chk-*/*.out
            chk-*/*.Rcheck/00check.log
            chk-*/*.Rcheck/00install.out
            chk-*/*.Rcheck/*-Ex.Rout*
            chk-*/*.Rcheck/tests/*.Rout*

      - uses: ./.github/actions/report
        if: always()
        with:
          status: ${{ job.status }}
          ran: ran.txt
          checks: |
            ${{ steps.bitwise.outcome }} | Rblas.dll with R's flags is CRAN's, bit for bit
            ${{ steps.install.outcome }} | dependencies installed
            ${{ steps.runs.outcome }} | R CMD check ran to the end under each DLL
          results: results.txt
          files: |
            Rdiff of every output: probe.log
            blas-bitwise.log
