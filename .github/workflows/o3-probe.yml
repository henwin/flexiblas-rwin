name: Rblas.dll with -O3, one package in detail

# For a package whose outputs differ with the -O3 Rblas.dll (o3-packages.yml):
# is it -O3, or the rebuild itself? Rblas.dll is built from the installed
# R's sources with R's flags (-O2) and with -O3, each is swapped into the R
# installation, and the package's examples and tests run under CRAN's DLL
# (twice), the -O2 rebuild and the -O3 rebuild. tests/blas-bitwise.sh also
# compares the rebuilt DLLs with CRAN's, routine by routine.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: CRAN packages, separated by spaces
        default: fastglmpca
      r:
        description: The R to test with, as CRAN builds it and its package binaries
        type: choice
        options: [devel, release]
        default: devel

env:
  OPTFLAGS_WORK: ${{ github.workspace }}\optflags-work

permissions:
  contents: read
  issues: write

# runs that report to the same comment wait for each other rather than race
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: Locate R and its sources
        shell: pwsh
        run: |
          $h = Rscript -e "cat(normalizePath(R.home()))"
          "R_HOME_DIR=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $b = Rscript -e "v <- R.version; cat(if (startsWith(v[['status']], 'Under')) 'trunk' else sprintf('branches/R-%s-%s-branch', v[['major']], sub('[.].*', '', v[['minor']])))"
          $r = Rscript -e "cat(R.version[['svn rev']])"
          "R_SVN_PATH=$b" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "R_SVN_REV=$r" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # blas-bitwise.sh fails when the build with R's flags is not CRAN's
      # Rblas.dll, which would leave the probe without its premise
      - name: Build Rblas.dll with R's flags and with -O3, compare bit for bit
        id: bitwise
        shell: C:\rtools45\usr\bin\bash.exe --login -o pipefail {0}
        env:
          CHERE_INVOKING: 1
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PATH
          rhome=$(cygpath -u "$R_HOME_DIR")
          echo "sources: $R_SVN_PATH at r$R_SVN_REV"
          mkdir -p src work
          for f in blas.f blas2.f90 cmplxblas.f cmplxblas2.f90 Rblas.def; do
            curl -sSf -o "src/$f" "https://svn.r-project.org/R/$R_SVN_PATH/src/extra/blas/$f?p=$R_SVN_REV" || exit 1
          done
          cd work
          bash ../tests/blas-bitwise.sh ../src "$rhome" 2>&1 | tee ../blas-bitwise.log

      - name: Install the packages
        id: install
        shell: bash
        run: Rscript tests/compare-optflags.R binary ${{ inputs.packages }} 2>&1 | tee -a probe.log

      # a run that exits non-zero is recorded and counted in the summary; it
      # is a result (a package may fail under every DLL), not a step failure
      - name: Run the examples and tests under each DLL
        id: runs
        shell: bash
        run: |
          bin=$(cygpath -u "$R_HOME_DIR")/bin/x64
          cp "$bin/Rblas.dll" work/Rblas-cran.dll
          run() {   # run dll
            cp "$2" "$bin/Rblas.dll"
            Rscript tests/compare-optflags.R test $1 default ${{ inputs.packages }} > /dev/null 2>&1 || echo "$1: exit status $?" | tee -a probe.log
          }
          run CRAN work/Rblas-cran.dll
          run CRANb work/Rblas-cran.dll
          run R2 work/blas-R.dll
          run O3 work/blas-O3.dll
          cp work/Rblas-cran.dll "$bin/Rblas.dll"
          W=$OPTFLAGS_WORK p="${{ inputs.packages }}"
          echo "== -O2 rebuild against CRAN's DLL" | tee -a probe.log
          Rscript tests/compare-runs.R --blank "$W/out-CRAN/%s,$W/out-CRANb/%s" "$W/out-R2/%s" $p 2>&1 | tee -a probe.log
          cp compare.tsv o2-vs-cran.tsv
          echo "== -O3 rebuild against CRAN's DLL" | tee -a probe.log
          Rscript tests/compare-runs.R --blank "$W/out-CRAN/%s,$W/out-CRANb/%s" "$W/out-O3/%s" $p 2>&1 | tee -a probe.log
          cp compare.tsv o3-vs-cran.tsv
          echo "== -O3 rebuild against the -O2 rebuild" | tee -a probe.log
          Rscript tests/compare-runs.R --blank "$W/out-R2/%s" "$W/out-O3/%s" $p 2>&1 | tee -a probe.log
          cp compare.tsv o3-vs-o2.tsv

      - name: Summarise
        id: summarise
        if: always()
        shell: bash
        run: |
          set +e
          # the verdict: what -O3 changes against the -O2 rebuild, one run each
          echo "verdict=-O3 against the -O2 rebuild, one run each: $(tests/optflags-verdict.sh o3-vs-o2.tsv)" >> $GITHUB_OUTPUT
          { grep -E '^== |of 76 routines' blas-bitwise.log; echo; cat probe.log; } > summary.log 2>/dev/null
          { echo "$(Rscript -e 'cat(R.version.string)' 2>/dev/null), sources $R_SVN_PATH at r$R_SVN_REV"
            echo "packages: ${{ inputs.packages }}"; } > ran.txt
          {
            grep -E '^== |of 76 routines' blas-bitwise.log 2>/dev/null || echo "routines: not found in blas-bitwise.log"
            echo "-O2 rebuild against CRAN's DLL: $(tests/optflags-verdict.sh o2-vs-cran.tsv)"
            echo "-O3 rebuild against CRAN's DLL: $(tests/optflags-verdict.sh o3-vs-cran.tsv)"
            echo "-O3 rebuild against the -O2 rebuild, one run each: $(tests/optflags-verdict.sh o3-vs-o2.tsv)"
            [ -f probe.log ] && echo "runs that exited non-zero: $(grep -c ': exit status ' probe.log)" || echo "runs that exited non-zero: probe.log not found"
          } > results.txt

      - uses: ./.github/actions/report
        if: always()
        with:
          status: ${{ job.status }}
          verdict: ${{ steps.summarise.outputs.verdict }}
          ran: ran.txt
          checks: |
            ${{ steps.bitwise.outcome }} | Rblas.dll with R's flags is CRAN's, bit for bit
            ${{ steps.install.outcome }} | packages installed
            ${{ steps.runs.outcome }} | runs under the four DLLs and comparisons
          results: results.txt
          files: |
            Differences in detail: summary.log
            blas-bitwise.log
