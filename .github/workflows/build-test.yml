name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  R_VERSION: 4.6.1
  FLEXIBLAS_VERSION: 3.5.0
  RTOOLS_BUILD: 6768

jobs:
  build:
    name: Cross-build with Rtools45 toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd innoextract

      - name: Cache Rtools tarballs
        uses: actions/cache@v6
        with:
          path: toolchain/*.tar.zst
          key: rtools45-${{ env.RTOOLS_BUILD }}

      - name: Set up toolchain
        run: bash scripts/setup-toolchain.sh

      - name: Build
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: flexiblas-rwin
          path: dist/
          if-no-files-found: error

  test:
    name: Test in R on Windows
    needs: build
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flexiblas-rwin
          path: dist

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Locate R
        shell: pwsh
        run: |
          $home_ = Rscript -e "cat(normalizePath(R.home()))"
          "R_HOME_DIR=$home_" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Reference run with R's own BLAS
        timeout-minutes: 5
        shell: pwsh
        run: Rscript -e "sessionInfo(); A <- crossprod(matrix(rnorm(360000), 600)); print(system.time(A %*% A))"

      - name: Install FlexiBLAS into R
        shell: pwsh
        run: |
          $bin = "$env:R_HOME_DIR\bin\x64"
          Copy-Item "$bin\Rblas.dll" "$bin\Rblas-reference.dll"
          Copy-Item dist\*.dll $bin -Force
          Copy-Item dist\flexiblasrc "$env:R_HOME_DIR\etc\flexiblasrc"
          "FLEXIBLAS_CONFIG=$env:R_HOME_DIR\etc\flexiblasrc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Startup with verbose FlexiBLAS
        timeout-minutes: 5
        shell: pwsh
        env:
          FLEXIBLAS_VERBOSE: 1
        run: Rscript -e "sessionInfo()"

      - name: Run tests
        timeout-minutes: 10
        shell: pwsh
        run: Rscript tests/test-flexiblas.R

      - name: R's BLAS regression tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          $t = "$env:R_HOME_DIR\tests\reg-BLAS.R"
          if (Test-Path $t) { Rscript $t } else { Write-Host "reg-BLAS.R not in the binary install; skipped" }
