name: Build and test

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - .gitattributes
      - .github/workflows/platforms.yml
      - .github/workflows/r-check.yml
  pull_request:
    paths-ignore:
      - '**.md'
      - .gitattributes
      - .github/workflows/platforms.yml
      - .github/workflows/r-check.yml
  workflow_dispatch:

env:
  R_VERSION: 4.6.1
  FLEXIBLAS_VERSION: 3.5.0
  RTOOLS_BUILD: 6768

jobs:
  build:
    name: Cross-build with Rtools45 toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The MXE build (OpenBLAS and FlexiBLAS) takes about an hour; it is
      # cached until the recipe, the patches or the build environment change.
      - name: Cache MXE build
        id: mxe-cache
        uses: actions/cache@v6
        with:
          path: dist
          key: mxe-${{ hashFiles('docker/Dockerfile', 'patches/rtools-mxe/**', 'scripts/build-mxe.sh') }}

      - name: Build in Docker
        run: |
          set -o pipefail
          opt=; [ "${{ steps.mxe-cache.outputs.cache-hit }}" = true ] && opt=--forwarders-only
          bash scripts/build-in-docker.sh $opt 2>&1 | tee docker-build.log

      - name: Publish build errors
        if: failure()
        run: |
          { grep -n -E 'error|Error|ERROR|No such|not found|failed|Failed' docker-build.log | tail -25; echo ...; tail -30 docker-build.log; } > tail.log
          split -l 30 -d tail.log part-
          for p in part-*; do
            t=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=docker-build.log (${p#part-})::$t"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: flexiblas-rwin
          path: dist/
          if-no-files-found: error

  test:
    name: Test in R on Windows
    needs: build
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flexiblas-rwin
          path: dist

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          rtools-version: '45'

      - name: Locate R
        shell: pwsh
        run: |
          $home_ = Rscript -e "cat(normalizePath(R.home()))"
          "R_HOME_DIR=$home_" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Reference run with R's own BLAS
        timeout-minutes: 5
        shell: pwsh
        run: Rscript -e "sessionInfo(); A <- crossprod(matrix(rnorm(360000), 600)); print(system.time(A %*% A))"

      - name: NA/NaN/Inf propagation with R's own BLAS and LAPACK
        timeout-minutes: 5
        shell: pwsh
        run: Rscript tests/test-nan.R ref

      - name: Install FlexiBLAS into R
        shell: pwsh
        run: |
          $bin = "$env:R_HOME_DIR\bin\x64"
          Copy-Item "$bin\Rblas.dll" "$bin\Rblas-reference.dll"
          # R's own LAPACK stays available for the symbols FlexiBLAS lacks.
          Copy-Item "$bin\Rlapack.dll" "$bin\Rlapack_ref.dll"
          Copy-Item dist\*.dll $bin -Force
          Copy-Item -Recurse dist\flexiblas "$bin\flexiblas" -Force
          # FlexiBLAS looks for its configuration in ..\etc relative to the
          # DLLs, as installed by MXE (bin\ and etc\); for R's bin\x64 that
          # is R_HOME\bin\etc (see patches/flexiblas/0001-windows-install-layout.patch).
          Copy-Item -Recurse dist\etc "$env:R_HOME_DIR\bin\etc" -Force

      - name: Install the flexiblas R package, patched for Windows
        timeout-minutes: 10
        shell: bash
        run: |
          exec > >(tee pkg-install.log) 2>&1
          set -x
          git -c core.autocrlf=false clone -q --depth 1 https://github.com/Enchufa2/r-flexiblas.git
          git -C r-flexiblas apply -v ../patches/r-flexiblas/0001-windows.patch
          Rscript -e "install.packages('tinytest', repos = 'https://cloud.r-project.org')"
          R CMD INSTALL --install-tests r-flexiblas
          Rscript -e "stopifnot(requireNamespace('flexiblas'))"

      - name: Startup with verbose FlexiBLAS
        timeout-minutes: 5
        shell: pwsh
        env:
          FLEXIBLAS_VERBOSE: 1
        run: Rscript -e "sessionInfo()" 2>&1 | Tee-Object -FilePath startup.log

      - name: Run tests
        timeout-minutes: 15
        shell: pwsh
        run: |
          Rscript tests/test-flexiblas.R 2>&1 | Tee-Object -FilePath tests.log
          exit $LASTEXITCODE

      - name: Run tests with OMP_NUM_THREADS=1
        if: always()
        timeout-minutes: 8
        shell: pwsh
        env:
          # Checks patches/openblas/0001-explicit-thread-count.patch: without
          # it, an explicit count above OMP_NUM_THREADS deadlocks.
          OMP_NUM_THREADS: 1
        run: |
          Rscript tests/test-flexiblas.R 2>&1 | Tee-Object -FilePath tests-omp1.log
          exit $LASTEXITCODE

      - name: NA/NaN/Inf propagation through FlexiBLAS backends
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          Rscript tests/test-nan.R cmp 2>&1 | Tee-Object -FilePath nan.log
          exit $LASTEXITCODE

      - name: Check that LAPACK calls reach FlexiBLAS
        if: always()
        timeout-minutes: 5
        shell: pwsh
        env:
          FLEXIBLAS_HOOK: PROFILE
          FLEXIBLAS_PROFILE_FILE: ${{ github.workspace }}\profile.txt
        run: |
          Rscript tests/test-profile.R
          if (-not (Test-Path profile.txt)) { Write-Host "no profile written"; exit 1 }
          Get-Content profile.txt | Where-Object { $_ -notmatch '\s0\s+0(\.0+)?(e[+-]?0+)?\s*$' } |
            Set-Content profile-nonzero.log
          $hits = Select-String -Path profile.txt -Pattern '^\s*(dpotrf|dgesv)\s+[1-9]'
          $hits | ForEach-Object { $_.Line }
          if (($hits | Measure-Object).Count -lt 2) { exit 1 }

      - name: R's BLAS regression tests
        if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $tag = "R-" + ($env:R_VERSION -replace '\.', '-')
          Invoke-WebRequest "https://raw.githubusercontent.com/wch/r-source/tags/$tag/tests/reg-BLAS.R" -OutFile reg-BLAS.R
          Rscript reg-BLAS.R 2>&1 | Tee-Object -FilePath reg-BLAS.log
          exit $LASTEXITCODE

      - name: The flexiblas package's own tests
        if: always()
        timeout-minutes: 10
        shell: pwsh
        env:
          # They expect a threaded default backend.
          FLEXIBLAS: OPENBLAS
        run: |
          Rscript -e "tinytest::test_package('flexiblas')" 2>&1 | Tee-Object -FilePath pkg-tests.log
          if (Select-String -Path pkg-tests.log -Pattern 'FAILED|Error|fails' -Quiet) { exit 1 }

      # Job logs live in blob storage that some API clients cannot reach;
      # annotations are served by the API itself.
      - name: Publish logs as annotations
        if: always()
        shell: pwsh
        run: |
          foreach ($f in "startup.log", "tests.log", "tests-omp1.log", "reg-BLAS.log", "pkg-install.log", "pkg-tests.log", "profile-nonzero.log", "nan.log") {
            if (Test-Path $f) {
              # Annotations are cut at about 4 KB, so publish in parts.
              $lines = Get-Content $f
              $part = 1; $buf = @()
              foreach ($l in $lines + "<<end>>") {
                if ($l -eq "<<end>>" -or (($buf -join "`n").Length + $l.Length) -gt 3500) {
                  $t = ($buf -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
                  Write-Host "::notice title=$f ($part)::$t"
                  $part++; $buf = @()
                }
                if ($l -ne "<<end>>") { $buf += $l }
              }
            }
          }
