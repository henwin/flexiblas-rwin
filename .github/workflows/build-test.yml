name: FlexiBLAS bundle

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - .gitattributes
      - .github/workflows/platforms.yml
      - .github/workflows/optflags.yml
      - patches/r/**
      - tests/**
      - .github/workflows/rcore-build.yml
      - patches/r-dev-web/0002-build-flexiblas-bundle.patch
      - patches/r-dev-web/0003-setup-inno-setup-from-github.patch
      - patches/r-dev-web/0004-build-patched-branch-name.patch
      - scripts/compare-codegen.sh
      - .github/workflows/blas-bitwise.yml
  pull_request:
    paths-ignore:
      - '**.md'
      - .gitattributes
      - .github/workflows/platforms.yml
      - .github/workflows/optflags.yml
      - patches/r/**
      - tests/**
      - .github/workflows/rcore-build.yml
      - patches/r-dev-web/0002-build-flexiblas-bundle.patch
      - patches/r-dev-web/0003-setup-inno-setup-from-github.patch
      - patches/r-dev-web/0004-build-patched-branch-name.patch
      - scripts/compare-codegen.sh
      - .github/workflows/blas-bitwise.yml
  workflow_dispatch:

env:
  FLEXIBLAS_VERSION: 3.5.0
  RTOOLS_BUILD: 6768

jobs:
  build:
    name: Cross-build with Rtools45 toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The MXE build of OpenBLAS takes about 1.5 hours; its files are cached
      # until the recipe, the Rtools patches or the build environment change.
      - name: Cache MXE build
        uses: actions/cache@v6
        with:
          path: mxe-out
          key: mxe-${{ hashFiles('docker/Dockerfile', 'patches/rtools-mxe/**', 'scripts/build-mxe.sh') }}

      # Docker's layer cache in GitHub, so that the Rtools tarballs and R's
      # MXE tree are fetched only when the Dockerfile changes; the docker
      # build in build-in-docker.sh then finds every layer cached.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: flexiblas-rwin-mxe
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build in Docker
        run: |
          set -o pipefail
          bash scripts/build-in-docker.sh 2>&1 | tee docker-build.log

      - name: Publish build errors
        if: failure()
        run: |
          { grep -n -E 'error|Error|ERROR|No such|not found|failed|Failed' docker-build.log | tail -25; echo ...; tail -30 docker-build.log; } > tail.log
          split -l 30 -d tail.log part-
          for p in part-*; do
            t=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=docker-build.log (${p#part-})::$t"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: flexiblas-rwin
          path: dist/
          if-no-files-found: error
