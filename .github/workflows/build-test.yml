name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  R_VERSION: 4.6.1
  FLEXIBLAS_VERSION: 3.5.0
  RTOOLS_BUILD: 6768

jobs:
  build:
    name: Cross-build with Rtools45 toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd innoextract

      - name: Cache Rtools tarballs
        uses: actions/cache@v6
        with:
          path: toolchain/*.tar.zst
          key: rtools45-${{ env.RTOOLS_BUILD }}

      - name: Set up toolchain
        run: bash scripts/setup-toolchain.sh

      - name: Cache OpenBLAS backends
        id: openblas-cache
        uses: actions/cache@v6
        with:
          path: openblas-dist
          key: openblas-${{ env.RTOOLS_BUILD }}-${{ hashFiles('scripts/build-openblas.sh') }}

      - name: Build OpenBLAS backends
        if: steps.openblas-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-openblas.sh

      - name: Build
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: flexiblas-rwin
          path: dist/
          if-no-files-found: error

  test:
    name: Test in R on Windows
    needs: build
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flexiblas-rwin
          path: dist

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          rtools-version: '45'

      - name: Locate R
        shell: pwsh
        run: |
          $home_ = Rscript -e "cat(normalizePath(R.home()))"
          "R_HOME_DIR=$home_" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Reference run with R's own BLAS
        timeout-minutes: 5
        shell: pwsh
        run: Rscript -e "sessionInfo(); A <- crossprod(matrix(rnorm(360000), 600)); print(system.time(A %*% A))"

      - name: Install FlexiBLAS into R
        shell: pwsh
        run: |
          $bin = "$env:R_HOME_DIR\bin\x64"
          Copy-Item "$bin\Rblas.dll" "$bin\Rblas-reference.dll"
          # R's own LAPACK stays available for the symbols FlexiBLAS lacks.
          Copy-Item "$bin\Rlapack.dll" "$bin\Rlapack_ref.dll"
          Copy-Item dist\*.dll $bin -Force
          # Found as the global configuration, <dir of libflexiblas.dll>\..\..\etc
          # (see patches/flexiblas/0001-windows-global-rc-path.patch).
          Copy-Item dist\flexiblasrc "$env:R_HOME_DIR\etc\flexiblasrc"

      - name: Startup with verbose FlexiBLAS
        timeout-minutes: 5
        shell: pwsh
        env:
          FLEXIBLAS_VERBOSE: 1
        run: Rscript -e "sessionInfo()" 2>&1 | Tee-Object -FilePath startup.log

      - name: Run tests
        timeout-minutes: 15
        shell: pwsh
        run: |
          Rscript tests/test-flexiblas.R 2>&1 | Tee-Object -FilePath tests.log
          exit $LASTEXITCODE

      - name: Run tests with OMP_NUM_THREADS=1
        if: always()
        timeout-minutes: 8
        shell: pwsh
        env:
          OMP_NUM_THREADS: 1
          # Without it, OpenBLAS 0.3.34 (OpenMP) runs a region sized by
          # OMP_NUM_THREADS even after an explicit, larger thread count, and
          # the threaded level-3 kernels deadlock waiting for partners.
          OMP_ADAPTIVE: 1
        run: |
          Rscript tests/test-flexiblas.R 2>&1 | Tee-Object -FilePath tests-omp1.log
          exit $LASTEXITCODE

      - name: Check that LAPACK calls reach FlexiBLAS
        if: always()
        timeout-minutes: 5
        shell: pwsh
        env:
          FLEXIBLAS_HOOK: PROFILE
          FLEXIBLAS_PROFILE_FILE: ${{ github.workspace }}\profile.txt
        run: |
          Rscript tests/test-profile.R
          if (-not (Test-Path profile.txt)) { Write-Host "no profile written"; exit 1 }
          Get-Content profile.txt | Where-Object { $_ -notmatch '\s0\s+0(\.0+)?(e[+-]?0+)?\s*$' } |
            Set-Content profile-nonzero.log
          $hits = Select-String -Path profile.txt -Pattern '^\s*(dpotrf|dgesv)\s+[1-9]'
          $hits | ForEach-Object { $_.Line }
          if (($hits | Measure-Object).Count -lt 2) { exit 1 }

      - name: R's BLAS regression tests
        if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $tag = "R-" + ($env:R_VERSION -replace '\.', '-')
          Invoke-WebRequest "https://raw.githubusercontent.com/wch/r-source/tags/$tag/tests/reg-BLAS.R" -OutFile reg-BLAS.R
          Rscript reg-BLAS.R 2>&1 | Tee-Object -FilePath reg-BLAS.log
          exit $LASTEXITCODE

      - name: Install the flexiblas R package, patched for Windows
        if: always()
        timeout-minutes: 10
        shell: bash
        run: |
          exec > >(tee pkg-install.log) 2>&1
          set -x
          git -c core.autocrlf=false clone -q --depth 1 https://github.com/Enchufa2/r-flexiblas.git
          git -C r-flexiblas apply -v ../patches/r-flexiblas/0001-windows.patch
          Rscript -e "install.packages('tinytest', repos = 'https://cloud.r-project.org')"
          R CMD INSTALL --install-tests r-flexiblas
          Rscript -e "stopifnot(requireNamespace('flexiblas'))"

      - name: Test the flexiblas R package
        if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $out = & {
            # The package's own tests expect a threaded default backend.
            $env:FLEXIBLAS = "OPENBLAS-THREADS"
            Rscript -e "tinytest::test_package('flexiblas')"
            Remove-Item Env:FLEXIBLAS
            Rscript tests/test-package.R
            $env:OMP_NUM_THREADS = 1
            Rscript tests/test-package.R
          } 2>&1
          $out | Tee-Object -FilePath pkg-tests.log
          if (Select-String -Path pkg-tests.log -Pattern 'FAILED|Error|fails' -Quiet) { exit 1 }

      # Job logs live in blob storage that some API clients cannot reach;
      # annotations are served by the API itself.
      - name: Publish logs as annotations
        if: always()
        shell: pwsh
        run: |
          foreach ($f in "startup.log", "tests.log", "tests-omp1.log", "reg-BLAS.log", "pkg-install.log", "pkg-tests.log", "profile-nonzero.log") {
            if (Test-Path $f) {
              $t = (Get-Content $f -Raw) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              Write-Host "::notice title=$f::$t"
            }
          }
