name: FlexiBLAS bundle

# Builds the FlexiBLAS bundle and tests it on Windows: every backend loaded
# through libflexiblas.dll, and the thread cases. Only x86_64 for now; aarch64
# is paused (scripts and patches keep it) until x86_64 works end to end. Open
# there: the OPENBLAS-OPENMP backend needs LLVM's libomp.dll, which installed
# R does not ship, and CRAN has no R for windows-11-arm to compare against. Runs when the bundle's inputs change (the same list as the
# provenance check in build-r.yml), and by hand.
on:
  push:
    branches: [master]
    paths: &inputs
      - docker/**
      - scripts/build-mxe.sh
      - scripts/build-bundle.sh
      - scripts/build-in-docker.sh
      - patches/rtools-mxe/**
      - patches/openblas/**
      - patches/flexiblas/**
      - patches/r-dev-web/flexiblas_bundle/**
      - .github/workflows/build-bundle.yml
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

# runs that report to the same comment wait for each other rather than race
# (per ref: a pull request queued behind master would cancel a pending
# master run, and build-r needs a bundle from master's current sources)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    runs-on: ubuntu-24.04
    env:
      # the artifact's name, which build-r.yml looks for
      ARTIFACT: ${{ matrix.target == 'aarch64' && 'flexiblas-rwin-aarch64' || 'flexiblas-rwin' }}
      DIST: ${{ matrix.target == 'aarch64' && 'FlexiBLAS-aarch64' || 'FlexiBLAS' }}
    steps:
      - uses: actions/checkout@v7

      # The MXE build of OpenBLAS and the bundle's pthreads OpenBLAS take
      # about 1.5 hours each. build-mxe.sh and build-bundle.sh keep them by
      # the hash of what they are built from, which these keys follow (the
      # Dockerfile pins R's MXE tree, whose OpenBLAS patches and version the
      # bundle uses); saved also when a later step fails.
      - name: Restore the MXE build
        id: mxe
        uses: actions/cache/restore@v6
        with:
          path: mxe-out
          key: mxe-${{ matrix.target }}-${{ hashFiles('docker/Dockerfile', 'patches/rtools-mxe/**', 'patches/openblas/**', 'scripts/build-mxe.sh') }}
      - name: Restore the bundle's OpenBLAS
        id: pthreads
        uses: actions/cache/restore@v6
        with:
          path: bundle-out
          key: bundle-${{ matrix.target }}-${{ hashFiles('docker/Dockerfile', 'patches/rtools-mxe/**', 'patches/openblas/**', 'patches/r-dev-web/flexiblas_bundle/build_ucrt.sh', 'scripts/build-bundle.sh') }}

      # Docker's layer cache in GitHub, one per target, so that the Rtools
      # tarballs and R's MXE tree are fetched only when the Dockerfile changes.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: WITH_AARCH64=${{ matrix.target == 'aarch64' && 'yes' || 'no' }}
          tags: flexiblas-rwin-mxe
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Build in Docker
        id: build
        run: bash scripts/build-in-docker.sh ${{ matrix.target }} 2>&1 | tee docker-build.log

      - name: Save the MXE build
        if: always() && steps.mxe.outputs.cache-hit != 'true' && hashFiles('mxe-out/*') != ''
        uses: actions/cache/save@v6
        with:
          path: mxe-out
          key: ${{ steps.mxe.outputs.cache-primary-key }}
      - name: Save the bundle's OpenBLAS
        if: always() && steps.pthreads.outputs.cache-hit != 'true' && hashFiles('bundle-out/*') != ''
        uses: actions/cache/save@v6
        with:
          path: bundle-out
          key: ${{ steps.pthreads.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/
          if-no-files-found: error

      # The bundle in a few lines, each saying "not found" when what it reads
      # is missing; the backends against the configuration files
      - name: Summarise
        if: always()
        run: |
          set +e
          log=dist/build_ucrt-${{ matrix.target }}.out
          tail -60 docker-build.log > tail.log
          ls -la dist dist/*/bin/* > dist.log 2>&1
          { echo "FlexiBLAS bundle for ${{ matrix.target }}, MXE r$(sed -n 's/^ARG MXE_REV=\([0-9]*\).*/\1/p' docker/Dockerfile)"
            echo "OPENBLAS-THREADS: $(cat dist/openblas-pthreads-${{ matrix.target }}.txt 2>/dev/null || echo 'not found')"; } > ran.txt
          {
            z=dist/$DIST.zip
            [ -f $z ] && echo "$z: $(du -k $z | cut -f1) kB, $(du -sk dist/$DIST | cut -f1) kB installed" || echo "$z: not found"
            echo "backends configured: $(ls dist/$DIST/etc/flexiblasrc.d 2>/dev/null | sed 's/\.conf$//' | tr '\n' ' ')(OPENBLAS-OPENMP OPENBLAS-THREADS expected)"
            echo "backend DLLs: $(ls dist/$DIST/bin/*/flexiblas/ dist/$DIST/bin/flexiblas/ 2>/dev/null | grep dll | tr '\n' ' ')"
            echo "sha256 of the backend DLLs and libflexiblas.dll:"
            sha256sum dist/$DIST/bin/*/flexiblas/*.dll dist/$DIST/bin/flexiblas/*.dll dist/$DIST/bin/*/libflexiblas.dll dist/$DIST/bin/libflexiblas.dll 2>/dev/null | sed 's#dist/[^ ]*/##; s/^/  /'
            grep -h -E '^-- (Build additional BLAS interface|-- Libs|Looking for Fortran DAXPY -)|does not contain a BLAS' $log 2>/dev/null | sed 's/^-- //' || echo "CMake's backend lines: not found in $log"
            grep -h ' imports: ' docker-build.log || echo "DLL imports: not found in docker-build.log"
          } > results.txt

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }}${{ matrix.target == 'aarch64' && ' (aarch64)' || '' }}
          status: ${{ job.status }}
          ran: ran.txt
          checks: |
            ${{ steps.build.outcome }} | bundle built, every backend in EXTRA, no runtime exported
            ${{ steps.upload.outcome }} | bundle uploaded
          results: results.txt
          files: |
            The bundle: dist.log
            The end of the build log: tail.log

  # On Windows, with the programs built by Rtools45 as a package's code
  # would be: every backend loaded through libflexiblas.dll
  # (tests/load-backends.c), and the thread-count cases behind
  # patches/openblas/ against the OPENBLAS-OPENMP backend
  # (tests/omp-cases.sh): static libgomp on x86_64, LLVM's shared libomp
  # on aarch64 (paused).
  test:
    name: Test on Windows (${{ matrix.target }})
    needs: build
    if: always() && needs.build.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: windows-2025
            artifact: flexiblas-rwin
            dist: FlexiBLAS
            bin: bin/x64
            rtools: C:\rtools45
            triplet: x86_64-w64-mingw32.static.posix
            cc: gcc
    runs-on: ${{ matrix.runner }}
    # a case that hangs costs 60 s (tests/omp-cases.sh)
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.rtools }}\usr\bin\bash.exe --login -eo pipefail {0}
    env:
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@v7

      # Without a bundle from this run there is nothing to test; the report
      # says so instead of keeping an earlier run's status.
      - name: Download the bundle
        id: bundle
        uses: actions/download-artifact@v8
        continue-on-error: ${{ needs.build.result != 'success' }}
        with:
          name: ${{ matrix.artifact }}
          path: dist

      # Rtools only; the R version given decides nothing else
      - uses: r-lib/actions/setup-r@v2
        if: steps.bundle.outcome == 'success'
        with:
          r-version: release
          install-r: false
          rtools-version: '45'

      # NETLIB and every backend DLL of the bundle, through libflexiblas,
      # run with only the bundle and Windows on PATH, as in an installed R
      # without Rtools; load-backends writes its file only when everything
      # held, and every backend is run before the verdict
      - name: Every backend through libflexiblas.dll
        id: load
        if: steps.bundle.outcome == 'success'
        run: |
          d=$PWD/dist/${{ matrix.dist }}/${{ matrix.bin }}
          PATH=/${{ matrix.triplet }}/bin:$PATH ${{ matrix.cc }} -O2 -o load-backends tests/load-backends.c -L$d -lflexiblas
          fail=0
          for b in NETLIB $(ls $d/flexiblas | sed -n 's/^libflexiblas_\(.*\)\.dll$/\1/p' | tr a-z A-Z); do
            PATH=$d:/c/Windows/System32 FLEXIBLAS=$b ./load-backends $b load-$b.ok 2>&1 | tee -a load.log || true
            [ -f load-$b.ok ] || { echo "$b: load-backends did not finish" | tee -a load.log; fail=1; }
          done
          exit $fail

      # omp-cases.sh exits 1 unless every case is ok, and that status is
      # the step's; run also when a backend failed to load
      - name: Thread cases against the OpenMP backend
        id: cases
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          CC: ${{ matrix.cc }}
        run: |
          d=$PWD/dist/${{ matrix.dist }}/${{ matrix.bin }}
          # the backend imports from libflexiblas.dll (and libomp.dll on
          # aarch64), which the loader finds on PATH
          export PATH=/${{ matrix.triplet }}/bin:$d:$PATH
          bash tests/omp-cases.sh "$(cygpath -w $d/flexiblas/libflexiblas_openblas-openmp.dll)" 2>&1 | tee omp-cases.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          set +e
          { echo "the bundle of run ${{ github.run_id }} on ${{ matrix.target }}, programs built with Rtools45"; } > ran.txt
          {
            echo "every backend through libflexiblas.dll (dgemm, dpotrf and the program's xerbla):"
            grep -h ': ' load.log 2>/dev/null | sed 's/^/  /' || echo "  no backend lines in load.log"
            echo "thread cases (team sizes against the count set, and dgemm from a parallel region):"
            sed -n '/^cases:/,$p' omp-cases.log 2>/dev/null | grep . | sed 's/^/  /' || echo "  tally not found in omp-cases.log"
          } > results.txt
          touch load.log omp-cases.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (Windows ${{ matrix.target }})
          status: ${{ (steps.bundle.outcome == 'success' || needs.build.result == 'success') && job.status || 'not run' }}
          # without a bundle: why
          verdict: ${{ steps.bundle.outcome != 'success' && (needs.build.result == 'success' && 'the build succeeded but its bundle could not be downloaded' || format('the build ended with {0}, so there was no bundle to test', needs.build.result)) || '' }}
          ran: ran.txt
          checks: |
            ${{ steps.bundle.outcome }} | the bundle downloaded
            ${{ steps.load.outcome }} | every backend loads and says ok
            ${{ steps.cases.outcome }} | every thread case ok, none hangs (60 s each)
          results: results.txt
          files: |
            load.log
            omp-cases.log
