name: FlexiBLAS bundle

# Builds the FlexiBLAS bundle for x86_64 and aarch64 and runs the thread
# cases against it. Runs when the bundle's inputs change (the same list as
# the provenance check in build-r.yml), and by hand.
on:
  push:
    branches: [master]
    paths:
      - docker/**
      - scripts/build-mxe.sh
      - scripts/build-bundle.sh
      - scripts/build-in-docker.sh
      - patches/rtools-mxe/**
      - patches/openblas/**
      - patches/flexiblas/**
      - patches/r-dev-web/flexiblas_bundle/**
      - .github/workflows/build-bundle.yml
  pull_request:
    paths:
      - docker/**
      - scripts/build-mxe.sh
      - scripts/build-bundle.sh
      - scripts/build-in-docker.sh
      - patches/rtools-mxe/**
      - patches/openblas/**
      - patches/flexiblas/**
      - patches/r-dev-web/flexiblas_bundle/**
      - .github/workflows/build-bundle.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FLEXIBLAS_VERSION: 3.5.0
  RTOOLS_BUILD: 6768

jobs:
  build:
    name: Cross-build with Rtools45 toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The MXE build of OpenBLAS takes about 1.5 hours; its files are cached
      # until the recipe, the Rtools patches or the build environment change.
      - name: Cache MXE build
        uses: actions/cache@v6
        with:
          path: mxe-out
          key: mxe-${{ hashFiles('docker/Dockerfile', 'patches/rtools-mxe/**', 'patches/openblas/**', 'scripts/build-mxe.sh') }}

      # The pthreads OpenBLAS the bundle builds, about as long, cached until
      # the bundle script changes
      - name: Cache the bundle's OpenBLAS
        uses: actions/cache@v6
        with:
          path: bundle-out
          key: bundle-${{ hashFiles('patches/r-dev-web/flexiblas_bundle/build_ucrt.sh', 'patches/openblas/**') }}

      # Docker's layer cache in GitHub, so that the Rtools tarballs and R's
      # MXE tree are fetched only when the Dockerfile changes; the docker
      # build in build-in-docker.sh then finds every layer cached.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: flexiblas-rwin-mxe
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build in Docker
        run: |
          set -o pipefail
          bash scripts/build-in-docker.sh 2>&1 | tee docker-build.log

      - name: Summarise
        if: always()
        run: |
          log=$(ls dist/build_ucrt-*.out 2>/dev/null || echo docker-build.log)
          { grep -n -E 'error|Error|ERROR|No such|not found|failed|Failed|Warning|WARNING' docker-build.log $log | grep -v -E 'liberror-perl|CheckLAPACKCompilerFlags|unused CMAKE_POLICY|toolchain file is deprecated|CMake Warning.*mxe-conf' | tail -25; echo ...; tail -30 $log; } > tail.log
          ls -la dist dist/*/bin/* > dist.log 2>&1 || true
          # the bundle in a few lines: the zip, the backends, the OpenBLAS build
          {
            for z in dist/*.zip; do echo "$z: $(du -k "$z" | cut -f1) kB, $(du -sk "${z%.zip}" | cut -f1) kB installed"; done
            echo "backends: $(ls dist/*/bin/*/flexiblas/ dist/*/bin/flexiblas/ 2>/dev/null | grep dll | tr '\n' ' ')"
            echo "OPENBLAS-THREADS built from OpenBLAS $(grep -m1 -o 'OBVER=[0-9.]*' patches/r-dev-web/flexiblas_bundle/build_ucrt.sh | cut -d= -f2)$(grep -q 'patching file' docker-build.log && echo ' in this run' || echo ', from the cache')"
            grep -h -E '^-- (Build additional BLAS interface|-- Libs|Looking for Fortran DAXPY -)|does not contain a BLAS' $log | sed 's/^-- //'
          } > summary.log 2>&1 || true

      - uses: ./.github/actions/report
        if: always()
        with:
          status: ${{ job.status }}
          summary: summary.log
          files: |
            The bundle: dist.log
            Errors and the end of the build log: tail.log

      - uses: actions/upload-artifact@v7
        with:
          name: flexiblas-rwin
          path: dist/
          if-no-files-found: error

  # The same for aarch64, with the LLVM toolchain in a second MXE tree.
  build-aarch64:
    name: Cross-build for aarch64 with the LLVM toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache MXE build
        uses: actions/cache@v6
        with:
          path: mxe-out
          key: mxe-aarch64-${{ hashFiles('docker/Dockerfile', 'patches/rtools-mxe/**', 'patches/openblas/**', 'scripts/build-mxe.sh') }}
      - name: Cache the bundle's OpenBLAS
        uses: actions/cache@v6
        with:
          path: bundle-out
          key: bundle-aarch64-${{ hashFiles('patches/r-dev-web/flexiblas_bundle/build_ucrt.sh', 'patches/openblas/**') }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: WITH_AARCH64=yes
          tags: flexiblas-rwin-mxe
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build in Docker
        run: |
          set -o pipefail
          bash scripts/build-in-docker.sh aarch64 2>&1 | tee docker-build.log

      - name: Summarise
        if: always()
        run: |
          log=$(ls dist/build_ucrt-*.out 2>/dev/null || echo docker-build.log)
          { grep -n -E 'error|Error|ERROR|No such|not found|failed|Failed|Warning|WARNING' docker-build.log $log | grep -v -E 'liberror-perl|CheckLAPACKCompilerFlags|unused CMAKE_POLICY|toolchain file is deprecated|CMake Warning.*mxe-conf' | tail -25; echo ...; tail -30 $log; } > tail.log
          ls -la dist dist/*/bin/* > dist.log 2>&1 || true
          # the bundle in a few lines: the zip, the backends, the OpenBLAS build
          {
            for z in dist/*.zip; do echo "$z: $(du -k "$z" | cut -f1) kB, $(du -sk "${z%.zip}" | cut -f1) kB installed"; done
            echo "backends: $(ls dist/*/bin/*/flexiblas/ dist/*/bin/flexiblas/ 2>/dev/null | grep dll | tr '\n' ' ')"
            echo "OPENBLAS-THREADS built from OpenBLAS $(grep -m1 -o 'OBVER=[0-9.]*' patches/r-dev-web/flexiblas_bundle/build_ucrt.sh | cut -d= -f2)$(grep -q 'patching file' docker-build.log && echo ' in this run' || echo ', from the cache')"
            grep -h -E '^-- (Build additional BLAS interface|-- Libs|Looking for Fortran DAXPY -)|does not contain a BLAS' $log | sed 's/^-- //'
          } > summary.log 2>&1 || true

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (aarch64)
          status: ${{ job.status }}
          summary: summary.log
          files: |
            The bundle: dist.log
            Errors and the end of the build log: tail.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flexiblas-rwin-aarch64
          path: |
            dist/
            docker-build.log

  # The thread-count cases behind patches/openblas/ (tests/omp-cases.sh)
  # against the OPENBLAS-OPENMP backend of the bundle just built, with the test
  # programs built by Rtools45 as a package's code would be: static
  # libgomp, dlopen from dlfcn-win32.
  thread-cases:
    name: Thread cases against the bundle on Windows
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flexiblas-rwin
          path: dist

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          rtools-version: '45'

      - name: Run the cases against the OpenMP backend
        shell: C:\rtools45\usr\bin\bash.exe --login -o pipefail {0}
        env:
          CHERE_INVOKING: 1
        run: |
          # the backend may import from libflexiblas.dll, which the loader finds on PATH
          export PATH=/x86_64-w64-mingw32.static.posix/bin:$PWD/dist/FlexiBLAS/bin/x64:$PATH
          lib=$(ls dist/FlexiBLAS/bin/x64/flexiblas/*openblas-openmp*.dll)
          echo "backend: $lib"
          objdump -p "$lib" | grep -E ' (openblas_set_num_threads|dgemm_)$'
          bash tests/omp-cases.sh "$(cygpath -w "$lib")" 2>&1 | tee omp-cases.log

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (thread cases)
          status: ${{ job.status }}
          files: omp-cases.log
