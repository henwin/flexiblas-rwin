name: Measurements of the backends and of NA, NaN and Inf

# The evidence on NA, NaN and Inf and on the backends, all reported and
# not checked, each job failing only if a run crashes or hangs. On
# Windows, the FlexiBLAS backends of the latest installer built by
# build-r.yml or chain.yml against CRAN's build of the same R, in
# NA/NaN/Inf propagation (tests/test-nan.R), chol() with non-finite input
# (tests/test-chol.R), memory use (tests/test-memory.R) and calls from
# OpenMP threads with a static libgomp (tests/test-omp-caller.R). On
# Fedora, its FlexiBLAS backends against each other, with OPENBLAS-OPENMP
# rebuilt with patches/openblas, memory use and calls from OpenMP threads
# with a shared libgomp; on macOS, Accelerate against R's BLAS; and the
# pattern of NA and NaN in results of R's own BLAS, LAPACK and arithmetic
# of CRAN's R (Posit's builds on Linux) on Windows, Linux and macOS,
# x86-64 and arm64, compared between platforms.
on:
  workflow_dispatch:
    inputs:
      r:
        description: The R whose latest installer the Windows job measures, against CRAN's build of it
        type: choice
        options: [devel, release]
        default: devel

permissions:
  actions: read
  contents: read
  issues: write

# bash -eo pipefail, so that a failing Rscript piped through tee fails the
# step (the default shell in a container and on Linux has no pipefail)
defaults:
  run:
    shell: bash

# runs that report to the same comment wait for each other rather than race
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The backends of the latest installer of a successful build-r.yml or
  # chain.yml run, against CRAN's build of the same R with R's own BLAS
  # and LAPACK: each step fails only if a run crashes or hangs, and the
  # results are reported, with what is expected next to them.
  backends-windows:
    name: Windows, FlexiBLAS backends against R's own
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find the latest installer
        id: prev
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a failed build uploads its installer too, for its own test job;
          # only a successful run's is used
          $id = $null
          foreach ($a in (gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=R-${{ inputs.r }}-installer&per_page=50" --jq '.artifacts[] | select(.expired | not) | [.workflow_run.id, .workflow_run.head_sha] | @tsv')) {
            $r, $s = $a -split "`t"
            if ((gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$r" --jq .conclusion) -eq "success") { $id = $r; $sha = $s; break }
          }
          if (-not $id) { throw "no R-${{ inputs.r }}-installer from a successful run; run chain.yml or build-r.yml first" }
          "run_id=$id" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "sha=$sha" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          name: R-${{ inputs.r }}-installer
          path: inst
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r }}
          rtools-version: '45'

      - name: Reference results with CRAN's build of the same R, with R's own BLAS and LAPACK
        id: ref
        timeout-minutes: 5
        shell: bash
        run: |
          Rscript -e "stopifnot(identical(R.version[['arch']], 'x86_64'))"
          Rscript tests/test-nan.R propagate ref
          Rscript -e "cat(R.version.string)" > ref-version.txt
          Rscript tests/test-chol.R "R's own" 2>&1 | tee chol.log

      - name: Install R and the flexiblas package
        id: install
        timeout-minutes: 15
        uses: ./.github/actions/install-built-r
        with:
          rbin: bin/x64

      - name: chol() with non-finite input
        id: chol
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        run: |
          for b in NETLIB OPENBLAS-OPENMP OPENBLAS-THREADS; do
            FLEXIBLAS=$b Rscript tests/test-chol.R 2>&1 | tee -a chol.log
          done

      - name: NA/NaN/Inf propagation through FlexiBLAS backends
        id: nan
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        # against R's own, saved by the reference step; without it test-nan.R
        # would compare with the first backend
        shell: bash
        run: |
          [ -f nan-ref.rds ] || { echo "::error::no nan-ref.rds from the reference step"; exit 1; }
          Rscript tests/test-nan.R propagate cmp 2>&1 | tee nan.log

      # A measurement, but a crash or a hang (the 64-thread product is the
      # one place where a count above the core count reaches dgemm) fails
      # the step and the job.
      - name: Memory use
        id: memory
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        run: |
          for b in OPENBLAS-OPENMP OPENBLAS-THREADS; do
            Rscript tests/test-memory.R $b 2>&1 | tee -a memory.log
            OPENBLAS_NUM_THREADS=1 Rscript tests/test-memory.R $b 2>&1 | tee -a memory.log
            OMP_NUM_THREADS=1 Rscript tests/test-memory.R $b 2>&1 | tee -a memory.log
          done

      - name: BLAS called from OpenMP threads with a static libgomp
        id: ompcaller
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 10
        shell: bash
        # large calls, and many small ones, where a server that serialises
        # callers would show
        run: |
          Rscript tests/test-omp-caller.R 2>&1 | tee omp-caller.log
          Rscript tests/test-omp-caller.R 200 200 2>&1 | tee -a omp-caller.log
          Rscript tests/test-omp-caller.R 64 1000 2>&1 | tee -a omp-caller.log

      - name: Summarise
        if: always()
        shell: bash
        run: |
          set +e
          line() { grep -m1 "$2" "$1" 2>/dev/null || echo "not found in $1"; }
          { echo "$(Rscript -e 'cat(R.version.string)' 2>/dev/null), installer from run ${{ steps.prev.outputs.run_id }} (commit ${{ steps.prev.outputs.sha }})"
            echo "reference: CRAN's build of R-${{ inputs.r }}, $(cat ref-version.txt 2>/dev/null || echo 'version not recorded')"; } > ran.txt
          {
            echo "nan.log (6 expected: dpotrf at six sizes for the two OpenBLAS backends): $(line nan.log 'results differ')"
            n=$(grep -c 'NaN on the diagonal' chol.log 2>/dev/null)
            echo "chol.log, NaN on the diagonal: ${n:-no} BLAS/LAPACK sets, $(grep -c 'NaN on the diagonal.*error:' chol.log 2>/dev/null) give an error (2 of 4 expected: R's own and NETLIB test the pivot with disnan(), OpenBLAS's dpotrf does not)"
            echo "memory.log, private bytes after loading the backend:"
            awk '/^backend:/ {b = $2; ob = $5; om = $8} /loaded,/ {found = 1; printf "  %-18s OPENBLAS_NUM_THREADS=%-7s OMP_NUM_THREADS=%-7s %s threads, %s MB\n", b, ob, om, $3, $6} END {if (!found) print "  not found in memory.log"}' memory.log 2>/dev/null || echo "  not found in memory.log"
            echo "omp-caller.log: process thread counts with as many OpenMP callers as cores and as many BLAS threads, n = 1000:"
            awk '/^cores:/ {c = $2; p = ($4 == 1000)} p && $2 == c && $3 == c {found = 1; printf "  %-18s %s threads, %s s\n", $1, $5, $4} END {if (!found) print "  not found in omp-caller.log"}' omp-caller.log 2>/dev/null || echo "  not found in omp-caller.log"
          } > results.txt 2>&1
          cat ran.txt results.txt

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (Windows backends, ${{ inputs.r }})
          status: ${{ job.status }}
          ran: ran.txt
          checks: |
            ${{ steps.ref.outcome }} | reference results from CRAN's R
            ${{ steps.install.outcome }} | installer and flexiblas package install
            ${{ steps.chol.outcome }} | chol() with non-finite input runs, per backend
            ${{ steps.nan.outcome }} | NA/NaN/Inf propagation runs, backends vs R's own
            ${{ steps.memory.outcome }} | memory use runs, per backend and thread setting
            ${{ steps.ompcaller.outcome }} | dgemm from OpenMP threads with a static libgomp runs
          results: results.txt
          files: |
            nan.log
            chol.log
            memory.log
            omp-caller.log


  backends-linux:
    name: Fedora, FlexiBLAS backends against each other
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v7

      - name: Install R with FlexiBLAS and its backends
        id: install
        timeout-minutes: 30
        run: |
          dnf install -y -q R-core R-core-devel R-flexiblas flexiblas-netlib binutils gcc redhat-rpm-config gh \
              flexiblas-openblas-serial flexiblas-openblas-openmp flexiblas-openblas-threads
          flexiblas list
          echo "version=$(rpm -q --qf '%{VERSION}' openblas-openmp)" >> $GITHUB_OUTPUT

      # Fedora's OpenMP OpenBLAS rebuilt from the same upstream version with
      # patches/openblas/, in its place, so that the OPENBLAS-OPENMP backend
      # has the patches; without them 0.3.34 hangs when the thread count
      # set exceeds the OpenMP team and in a caller's parallel region (run
      # 43007389890). Here, with one libgomp shared by R, the packages and
      # OpenBLAS, all four patches act. A version the patches no longer
      # apply to fails the step.
      - name: Restore the patched OpenBLAS
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/openblaso
          key: openblaso-${{ steps.install.outputs.version }}-${{ hashFiles('patches/openblas/*.patch') }}

      - name: OpenBLAS ${{ steps.install.outputs.version }} with patches/openblas, OpenMP
        id: openblas
        timeout-minutes: 60
        run: |
          v=${{ steps.install.outputs.version }}
          if [ "${{ steps.cache.outputs.cache-hit }}" != true ]; then
            dnf install -y -q patch
            curl -sSfL https://github.com/OpenMathLib/OpenBLAS/releases/download/v$v/OpenBLAS-$v.tar.gz | tar xz
            for p in patches/openblas/*.patch; do patch -d OpenBLAS-$v -p1 < $p; done
            o="USE_OPENMP=1 USE_THREAD=1 DYNAMIC_ARCH=1 TARGET=CORE2 NUM_THREADS=64 LIBNAMESUFFIX=o NO_STATIC=1"
            # shared depends on libs and netlib and runs them one after the other
            make -C OpenBLAS-$v -j$(nproc) $o shared > openblas-build.log 2>&1 || { tail -50 openblas-build.log; exit 1; }
            make -C OpenBLAS-$v $o PREFIX=/opt/openblaso install > /dev/null
          fi
          # onto the file Fedora's soname link points to, keeping the link
          f=$(readlink -f /usr/lib64/libopenblaso.so.0)
          install -m 755 /opt/openblaso/lib/libopenblaso.so.0 "$f"
          ldconfig
          cmp /opt/openblaso/lib/libopenblaso.so.0 /usr/lib64/libopenblaso.so.0
          ldd $(rpm -ql flexiblas-openblas-openmp | grep 'openblas-openmp\.so$') | grep libopenblaso

      - name: Save the patched OpenBLAS
        if: steps.cache.outputs.cache-hit != 'true' && steps.openblas.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: /opt/openblaso
          key: openblaso-${{ steps.install.outputs.version }}-${{ hashFiles('patches/openblas/*.patch') }}

      - name: Compare backends
        id: nan
        timeout-minutes: 5
        run: Rscript tests/test-nan.R propagate cmp 2>&1 | tee nan.log

      - name: Memory use
        id: memory
        if: always() && steps.openblas.outcome == 'success'
        timeout-minutes: 10
        run: |
          # each run limited, so that one that hangs shows which it is; the
          # step fails if any run fails or times out (124)
          st=0
          for b in OPENBLAS-OPENMP OPENBLAS-THREADS; do
            for t in "" 1; do
              echo "== $b${t:+ OPENBLAS_NUM_THREADS=$t}"
              env ${t:+OPENBLAS_NUM_THREADS=$t} timeout -k 10 120 Rscript tests/test-memory.R $b 2>&1 || { r=$?; echo "exit status $r"; st=1; }
            done
          done > memory.log
          cat memory.log
          exit $st

      - name: BLAS called from OpenMP threads, shared libgomp
        id: ompcaller
        if: always() && steps.openblas.outcome == 'success'
        timeout-minutes: 15
        run: |
          Rscript tests/test-omp-caller.R 2>&1 | tee omp-caller.log
          Rscript tests/test-omp-caller.R 200 200 2>&1 | tee -a omp-caller.log
          Rscript tests/test-omp-caller.R 64 1000 2>&1 | tee -a omp-caller.log
          # the pthreads server prints a warning per call from a parallel
          # region; count them rather than show them
          n=$(grep -c 'Detect OpenMP Loop' omp-caller.log || true); grep -v 'Detect OpenMP Loop' omp-caller.log > omp-caller-short.log || true
          echo "($n lines 'OpenBLAS Warning : Detect OpenMP Loop and this application may hang' removed)" >> omp-caller-short.log

      # every step's outcome, then the one-line results, "not found" when a
      # log lacks its line
      - name: Summarise
        id: summarise
        if: always()
        run: |
          set +e
          echo "verdict=$(tr -d '\r' < nan-verdict.txt 2>/dev/null)" >> $GITHUB_OUTPUT
          { grep -E '^(R version|CPU:|BLAS:)' nan.log 2>/dev/null | head -3
            echo "Fedora's FlexiBLAS backends, OPENBLAS-OPENMP rebuilt from OpenBLAS ${{ steps.install.outputs.version }} with patches/openblas, with OpenBLAS's bundled LAPACK, which may differ from Fedora's build"; } > ran.txt
          {
            echo "nan.log: $(grep -m1 'results differ' nan.log 2>/dev/null || echo 'not found in nan.log')"
            echo "omp-caller.log, as many OpenMP callers as cores with as many BLAS threads, n = 1000 (shared libgomp):"
            awk '/^cores:/ {c = $2; p = ($4 == 1000)} p && $2 == c && $3 == c {found = 1; printf "  %-18s %s threads, %s s\n", $1, $5, $4} END {if (!found) print "  not found in omp-caller.log"}' omp-caller-short.log 2>/dev/null || echo "  not found in omp-caller.log"
            echo "memory.log, after loading the backend:"
            grep -E 'loaded,' memory.log 2>/dev/null | sed 's/^/  /' || echo "  not found in memory.log"
          } > results.txt

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (Fedora backends)
          status: ${{ job.status }}
          verdict: ${{ steps.summarise.outputs.verdict }}
          ran: ran.txt
          checks: |
            ${{ steps.openblas.outcome }} | OPENBLAS-OPENMP with patches/openblas
            ${{ steps.nan.outcome }} | test-nan.R propagate cmp runs
            ${{ steps.memory.outcome }} | test-memory.R per backend runs
            ${{ steps.ompcaller.outcome }} | test-omp-caller.R runs
          results: results.txt
          files: |
            nan.log
            omp-caller.log: omp-caller-short.log
            memory.log

  backends-macos:
    name: macOS arm64, R's BLAS against Accelerate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Reference with R's own BLAS
        id: ref
        run: Rscript tests/test-nan.R propagate ref

      - name: Switch libRblas to Accelerate (vecLib) and compare
        id: cmp
        run: |
          lib=$(Rscript -e 'cat(R.home("lib"))')
          ls -l "$lib"/libRblas*
          ln -sf libRblas.vecLib.dylib "$lib/libRblas.dylib"
          Rscript -e 'sessionInfo()' | grep -i -A2 blas
          Rscript tests/test-nan.R propagate cmp 2>&1 | tee nan.log

      - name: Summarise
        id: summarise
        if: always()
        run: |
          set +e
          echo "verdict=$(tr -d '\r' < nan-verdict.txt 2>/dev/null)" >> $GITHUB_OUTPUT
          { grep -E '^(R version|BLAS:|LAPACK:)' nan.log 2>/dev/null | head -3; } > ran.txt

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (macOS Accelerate)
          status: ${{ job.status }}
          verdict: ${{ steps.summarise.outputs.verdict }}
          ran: ran.txt
          checks: |
            ${{ steps.ref.outcome }} | test-nan.R propagate ref, R's own BLAS
            ${{ steps.cmp.outcome }} | test-nan.R propagate cmp, Accelerate
          files: nan.log

  platforms:
    name: The NA/NaN pattern of R's own BLAS, LAPACK and arithmetic per platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x86-64 }
          - { os: ubuntu-latest, label: linux-x86-64 }
          - { os: ubuntu-26.04-arm, label: linux-arm64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-26-intel, label: macos-x86-64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Record
        shell: bash
        run: Rscript tests/test-nan.R pattern run ${{ matrix.label }}
      - uses: actions/upload-artifact@v7
        with:
          name: nan-pattern-${{ matrix.label }}
          path: nan-pattern-${{ matrix.label }}.txt

  compare:
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/download-artifact@v8
        with:
          pattern: nan-pattern-*
          merge-multiple: true
      # all five platforms, or the comparison says less than it seems to
      - name: Compare
        id: compare
        run: |
          n=$(ls nan-pattern-*.txt 2>/dev/null | wc -l)
          echo "$n of 5 platforms recorded: $(ls nan-pattern-*.txt 2>/dev/null | sed 's/nan-pattern-//; s/[.]txt//' | tr '\n' ' ')" | tee compare.log
          Rscript tests/test-nan.R pattern compare nan-pattern-*.txt 2>&1 | tee -a compare.log
          [ "$n" -eq 5 ] || { echo "::error::$n of 5 platforms recorded"; exit 1; }

      # the outcomes, the platforms, one line per operation, and the count;
      # the cells are the detail
      - name: Summarise
        id: summarise
        if: always()
        run: |
          set +e
          echo "verdict=$(tr -d '\r' < nan-verdict.txt 2>/dev/null)" >> $GITHUB_OUTPUT
          grep -E '^[0-9] of 5 platforms|^[a-z0-9-]+ +[a-z0-9_]+-' compare.log > ran.txt 2>/dev/null
          grep -E '^\S.* (differ|same) on ' compare.log > results.txt 2>/dev/null

      - uses: ./.github/actions/report
        if: always()
        with:
          key: ${{ github.workflow }} (platforms)
          status: ${{ job.status }}
          verdict: ${{ steps.summarise.outputs.verdict }}
          ran: ran.txt
          checks: |
            ${{ needs.platforms.result }} | recording on the five platforms
            ${{ steps.compare.outcome }} | comparison, all five present
          results: results.txt
          files: compare.log
