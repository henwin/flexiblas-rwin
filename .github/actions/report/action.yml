name: Report to the results issue
description: >
  Writes the result of this run as a comment on the results issue (#1),
  one comment per key, replaced on every run, in one layout for every
  workflow: a heading with the verdict, the run link, commit and time,
  then open what ran, the checks with their outcomes and the results, then
  the files given, collapsed. Job
  logs live in blob storage that some API clients
  cannot reach; issue comments are served by the API itself. The calling
  workflow needs permissions: issues: write.
inputs:
  key:
    description: What the comment stands for; one comment per key
    default: ${{ github.workflow }}
  status:
    description: The job's status, job.status
    required: true
  ran:
    description: >
      A file of what ran, one or more lines: the R and its revision, the
      platform, the bundle, the packages
    default: ''
  checks:
    description: >
      The checks, one per line as "OUTCOME | label", OUTCOME a step outcome
      or a step output: success or ok passed, empty, skipped or "not run"
      not run, anything else (failure, cancelled, a reason) failed; each
      fails the run when it fails
    default: ''
  results:
    description: >
      A file of what the run measured or found, reported and not checked,
      one item per line
    default: ''
  verdict:
    description: >
      What the run found, for the heading (a run whose findings are
      results, such as differences, succeeds whatever it finds); without
      it the heading is made from the checks: "all N checks passed",
      "failed: ..." or "N of M checks passed, K not run"; the status is
      added when the run failed and the heading does not say so
    default: ''
  files:
    description: >
      Files to show, one per line, as "Label: path" or a path, collapsed; a
      missing or empty file is noted
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: ${{ inputs.key }}
        STATUS: ${{ inputs.status }}
        VERDICT: ${{ inputs.verdict }}
        RAN: ${{ inputs.ran }}
        CHECKS: ${{ inputs.checks }}
        RESULTS: ${{ inputs.results }}
        FILES: ${{ inputs.files }}
      run: |
        issue=1
        # the checks: outcome and label per line, an empty outcome not run
        n=0; ok=0; notrun=0; failed=; chk=
        trim() { sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' <<< "$1"; }
        while IFS= read -r line; do
          [ -n "${line//[[:space:]]/}" ] || continue
          o=$(trim "${line%%|*}"); l=$(trim "${line#*|}")
          n=$((n + 1))
          case $o in
            success|ok) ok=$((ok + 1)) ;;
            ''|skipped|"not run") notrun=$((notrun + 1)); o=${o:-not run} ;;
            *) failed="${failed:+$failed, }$l" ;;
          esac
          chk="$chk$(printf '  %-60s %s' "$l" "$o")"$'\n'
        done <<< "$CHECKS"
        # the heading: the verdict given, or one made from the checks
        if [ -n "$VERDICT" ]; then head=$VERDICT; [ -z "$failed" ] || head="failed: $failed; $head"
        elif [ -n "$failed" ]; then head="failed: $failed"
        elif [ $n -gt 0 ] && [ $notrun -eq 0 ]; then head="all $n checks passed"
        elif [ $n -gt 0 ]; then head="$ok of $n checks passed, $notrun not run"
        else head=$STATUS; fi
        [ "$STATUS" = success ] || [ -n "$failed" ] || [ "$head" = "$STATUS" ] || head="$STATUS; $head"
        {
          echo "<!-- report: $KEY -->"
          echo "### $KEY — $head"
          echo "[run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · ${GITHUB_SHA:0:7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          if [ -n "$RAN$chk$RESULTS" ]; then
          echo; echo '```'
          [ -z "$RAN" ] || { echo "Ran:"; if [ -s "$RAN" ]; then tr -d '\r' < "$RAN" | sed -e '/^[[:space:]]*$/d' -e 's/^/  /'; else echo "  not recorded: $RAN missing or empty"; fi; }
          [ -z "$chk" ] || { echo "Checks (the run fails if one fails):"; printf '%s' "$chk"; }
          if [ -n "$RESULTS" ]; then
            echo "Results (reported, not checked):"
            if [ -s "$RESULTS" ]; then head -c 8000 "$RESULTS" | tr -d '\r' | awk '{print "  " $0}'; [ $(wc -c < "$RESULTS") -le 8000 ] || echo "  ... (cut)"; else echo "  none: $RESULTS missing or empty"; fi
          fi
          echo '```'
          fi
          # a comment holds 65536 characters: the summary up to about 8000
          # and what ran and the checks, the rest shared by the files
          nf=$(grep -c . <<< "$FILES" || true); cap=$((52000 / (nf > 0 ? nf : 1)))
          while IFS= read -r line; do
            line=$(echo "$line" | sed -e 's/^ *//; s/ *$//')
            [ -n "$line" ] || continue
            case $line in
              *": "*) label=${line%%: *}; path=${line#*: } ;;
              *) label=$(basename "$line"); path=$line ;;
            esac
            echo
            if [ ! -s "$path" ]; then echo "_$label: no output_"; continue; fi
            n=$(wc -l < "$path")
            echo "<details><summary>$label ($n lines)</summary>"
            echo; echo '```'
            # bytes that are not UTF-8 (test output in other encodings, or a
            # character cut by the cap) would make the comment invalid JSON
            tr -d '\r' < "$path" | head -c $cap | iconv -c -f UTF-8 -t UTF-8 2>/dev/null || true; echo
            [ $(wc -c < "$path") -le $cap ] || echo "... (cut)"
            echo '```'
            echo "</details>"
          done <<< "$FILES"
        } > report.md
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --paginate \
               --jq ".[] | select(.body | startswith(\"<!-- report: $KEY -->\")) | .id" | head -1)
        # the report in the job log should posting fail
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md > /dev/null || { echo "posting failed; the report:"; cat report.md; exit 1; }
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -F body=@report.md > /dev/null || { echo "posting failed; the report:"; cat report.md; exit 1; }
        fi
        echo "reported as '$KEY'"
